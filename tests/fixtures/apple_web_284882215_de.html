 Profil an und lege fest, wie du angezeigt wirst und wer deine Beiträge sehen kann.\r\n* Erstelle aus aktuellen Vorlagen mühelos eigene Reels oder lass deiner Kreativität mit vielfältigen Bearbeitungs-Tools freien Lauf.\r\n* Zeige spontane Momente in den Stories.\r\n\nNutzungsbedingungen & Richtlinien https://www.facebook.com/policies_center","mediaType":"text/plain","style":"standard","alignment":"localized","isCollapsed":true,"suppressVerticalMargins":false,"wantsCollapsedNewlines":true},"developerAction":{"title":"Meta Platforms, Inc.","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"actionType":"navigate","actionUrl":"https://apps.apple.com/de/developer/meta-platforms-inc/id284882218","location":[{"locationPosition":0,"locationType":"button","name":"Meta Platforms, Inc.","idType":"its_id","id":"284882218"}],"eventType":"click","targetType":"button","targetId":"284882218","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"page","pageUrl":"https://apps.apple.com/de/developer/meta-platforms-inc/id284882218","pageData":null,"presentationContext":"infer","animationBehavior":"infer","origin":"inapp","destination":{"storefront":"de","language":"de-DE","id":"284882218","$kind":"DeveloperPageIntent"}},"tags":[],"developerLinks":[{"$kind":"ProductPageLink","text":"Website","clickAction":{"presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"ExternalUrlAction","actionClass":"ExternalUrlAction","url":"http://www.facebook.com/mobile","isSensitive":false},"systemImageName":"safari"},{"$kind":"ProductPageLink","text":"Support","clickAction":{"presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"ExternalUrlAction","actio 9187080","title":"iPhone App für Facebook taugt Nix, einloggen unmöglich.","contents":"Seit vier Monaten lässt sich diese App nicht mehr auf dem iPhone starten. Es erscheint immer die Meldung „es ist ein unerwarteter Fehler aufgetreten. Bitte versuche noch einmal dich anzumelden. Netzwerk Einstellungen überprüft, Erreichbarkeit von Facebook überprüft, App deinstalliert neu installiert und so weiter. Alle Tipps die im Internet zu diesem Thema zu finden waren ausprobiert, keine Chance die App zu starten. Lustig: über den Chrome Browser auf dem iPhone kann ich mich einloggen. Es ist also definitiv ein Fehler der App. Auch auf dem iPad kann ich mich ohne Probleme mit der App einloggen. Lediglich auf dem iPhone elf mit dem neuesten Betriebssystem ist ein anmelden unmöglich. Da es bei Facebook auch keine telefonische Hotline mehr gibt,Ist auch eine Rücksprache mit dem Kunden Service nicht mehr möglich. Auf schriftlichen Hinweise reagiert Facebook nicht. Ich empfehle allen Facebook zu verlassen und einen anderen Messenger Dienst aufzusuchen. Facebook hat seinen Zenit überschritten. Es gibt mittlerweile gleichwertige Dienste, die nicht so arrogant mit ihren Kunden umgehen. Ich bin tief enttäuscht","rating":5,"reviewerName":"Squeezeboxt","date":"2021-02-20T23:50:33.000Z","dateText":"* null *","dateAuthorText":"* null * · Squeezeboxt","moreAction":{"title":"Bewertungen & Rezensionen","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"2","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"7019187080","title":"iPhone App für Facebook taugt Nix, einloggen unmöglich.","contents":"Seit vier Monaten lässt sich diese App nicht mehr auf dem iPhone starten. Es erscheint immer die Meldung „es ist ein unerwarteter Fehler aufgetreten. Bitte versuche noch einmal dich anzumelden. Netzwerk Einstellungen überprüft, Erreichbarkeit von Facebook überprüft, App deinstalliert neu installiert und so weiter. Alle Tipps die im Internet zu diesem Thema zu finden waren ausprobiert, keine Chance die App zu starten. Lustig: über den Chrome Browser auf dem iPhone kann ich mich einloggen. Es ist also definitiv ein Fehler der App. Auch auf dem iPad kann ich mich ohne Probleme mit der App einloggen. Lediglich auf dem iPhone elf mit dem neuesten Betriebssystem ist ein anmelden unmöglich. Da es bei Facebook auch keine telefonische Hotline mehr gibt,Ist auch eine Rücksprache mit dem Kunden Service nicht mehr möglich. Auf schriftlichen Hinweise reagiert Facebook nicht. Ich empfehle allen Facebook zu verlassen und einen anderen Messenger Dienst aufzusuchen. Facebook hat seinen Zenit überschritten. Es gibt mittlerweile gleichwertige Dienste, die nicht so arrogant mit ihren Kunden umgehen. Ich bin tief enttäuscht","rating":5,"reviewerName":"Squeezeboxt","date":"2021-02-20T23:50:33.000Z","dateText":"* null *","dateAuthorText":"* null * · Squeezeboxt"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"284882215","targetReviewId":"7019187080"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"7019187080","impressionMetrics":{"fields":{"id":"7019187080","name":"","impressionType":"helpfulReview","idType":"its_id" öglichkeiten sind irgendwas zu ändern sucht man manche Sachen zT 3 mal bis man sie wirklich vorfindet und wenn man es dann eingestellt hat und paar Tage später nochmal drauf schaut ist die Einstellung nicht mehr aktiv und man muss es direkt wieder machen, am schlimmsten davon betroffen ist der DarkMode, es ändert sich quasi stündlich immer wieder auf Hell, egal ob man System oder Dunkel auswählt, es geht immer wieder aus dem DarkMode raus, das ist nicht nur bei mir ein Einzelfall oder der System-Fehler vor dem Gerät sondern ist das bei fast allen iOS Usern, das muss unbedingt mal auf Vordermann gebracht werden, lesen die App-Entwickler die Bewertungen gar nicht, 1,8 ist jetzt nicht wirklich eine gute Note für eine App die so gut wie jeder der einen Internet Zugang hat nutzt, hier müsste man mehr auf die Bewertungen eingehen, das was stark kritisiert wird besser machen und dann kommen auch bessere Bewertungen.. Flohmarkt, Reels und Benachrichtigungen, alles Top, viel mehr Reiter braucht es auch nicht um nicht überladen zu wirken aber an der Übersichtlichkeit, den Einstellungen an sich, das was gespeichert wird muss gespeichert bleiben muss dringend nachgebessert werden. Der DarkMode ist für viele ein muss und wenn das nicht funktioniert nutzen es viele weniger. Bitte um Nachbesserung und dann gibt es auch wieder 5 Sterne.. liebe Grüße an die Entwickler.. wir glauben an euch 🥰","rating":3,"reviewerName":"ilazar","date":"2022-08-19T10:37:07.000Z","dateText":"* null *","dateAuthorText":"* null * · ilazar","moreAction":{"title":"Bewertungen & Rezensionen","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"4","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"8994290459","title":"Gut aber leider mit Macken","contents":"Ich bin seit etlichen Jahren bei Facebook und nutze es auch auf allen Endgeräten die ich so besitze, die Funktionen sind durchdacht aber leider werden Einstellungen nicht immer und oft gar nicht gespeichert   Da es sehr viele Möglichkeiten sind irgendwas zu ändern sucht man manche Sachen zT 3 mal bis man sie wirklich vorfindet und wenn man es dann eingestellt hat und paar Tage später nochmal drauf schaut ist die Einstellung nicht mehr aktiv und man muss es direkt wieder machen, am schlimmsten davon betroffen ist der DarkMode, es ändert sich quasi stündlich immer wieder auf Hell, egal ob man System oder Dunkel auswählt, es geht immer wieder aus dem DarkMode raus, das ist nicht nur bei mir ein Einzelfall oder der System-Fehler vor dem Gerät sondern ist das bei fast allen iOS Usern, das muss unbedingt mal auf Vordermann gebracht werden, lesen die App-Entwickler die Bewertungen gar nicht, 1,8 ist jetzt nicht wirklich eine gute Note für eine App die so gut wie jeder der einen Internet Zugang hat nutzt, hier müsste man mehr auf die Bewertungen eingehen, das was stark kritisiert wird besser machen und dann kommen auch bessere Bewertungen.. Flohmarkt, Reels und Benachrichtigungen, alles Top, viel mehr Reiter braucht es auch nicht um nicht überladen zu wirken aber an der Übersichtlichkeit, den Einstellungen an sich, das was gespeichert wird muss gespeichert bleiben muss dringend nachgebessert werden. Der DarkMode ist für viele ein muss und wenn das nicht funktioniert nutzen es viele weniger. Bitte um Nachbesserung und dann gibt es auch wieder 5 Sterne.. liebe Grüße an die Entwickler.. wir glauben an euch 🥰","rating":3,"reviewerName":"ilazar","date":"2022-08-19T10:37:07.000Z","dateText":"* null *","dateAuthorText":"* null * · ilazar"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":nu nummer.\n\nERHALTE UMGEHEND ANTWORTEN VOM KI-ASSISTENTEN\nMeta AI ist dein Assistent und steht dir mit Antworten, Ratschlägen, Hausaufgabenhilfe und mehr zur Seite.\n\nSENDE DEINE FOTOS IN HOHER AUFLÖSUNG\nSende und empfange mit dem Messenger deutlichere, schärfere Bilder deiner liebsten Momente.\n\nERSTELLE GEMEINSAME ALBEN\nVom letzten Sommerurlaub bis zu Omas 80. Geburtstag – erstelle Alben mit Fotos und Videos, teile und organisiere sie und erinnere dich gemeinsam mit anderen in Gruppenchats an die schönsten Momente.\n\nFÜGE GANZ EINFACH NEUE KONTAKTE HINZU – MIT QR-CODES\nBleibe in Kontakt mit Personen, die du persönlich triffst, indem du ihren Messenger-QR-Code scannst oder deinen eigenen über einen Link teilst.\n\nTEILE GROSSE DATEIEN DIREKT IM CHAT\nGanz egal, ob Word-, PDF- oder Excel-Datei: Versende Dateien mit bis zu 100 MB direkt im Messenger.\n\nBEARBEITE NACHRICHTEN ODER RUFE SIE ZURÜCK \nZu schnell auf „Senden“ geklickt? Du kannst deine Nachrichten bis zu 15 Minuten nach dem Versenden bearbeiten.\n\nSELBSTLÖSCHENDE NACHRICHTEN\nManche Dinge sind nicht für die Ewigkeit gedacht. Entscheide selbst, wie lange deine Ende-zu-Ende-verschlüsselten Chats sichtbar bleiben, nachdem sie gelesen wurden.\n\nVERBINDE DICH MIT DEINEN COMMUNITYS\nBleibe mit Menschen aus deiner Schule oder deiner Nachbarschaft oder mit Gleichgesinnten in Verbindung.\n\nSEI DEINEN LIEBLINGSCREATOR*INNEN GANZ NAH\nBleibe auf dem Laufenden rund um Creator*innen, indem du ihren Broadcast-Channels mit authentischen und spontanen Inhalten beitrittst.\n\nLASS DEINER KREATIVITÄT FREIEN LAUF MIT META AI\nNutze Meta AI als kreativen Partner, um Bilder zu erstellen, zu bearbeiten, zu animieren und mehr.\n\nFANG MOMENTE AUS DEM ALLTAG IN STORIES EIN\nZeige in Stories Momente aus deinem Alltag mit Fotos und Videos, die nach 24 Stunden verschwinden.\n\nTEILE EINE NOTIZ MIT DEINEN GEDANKEN\nBleibe mit Freund*innen in Verbindung, indem du kurze Updates teilst, die nach 24 Stunden verschwinden.\n\nVERLEIHE DEINEN CHATS DEINEN VIBE\nManchmal reichen Worte einfach nicht aus. Nutze andere Möglichkeiten, um dich auszudrücken: mit animierten Stickern, GIFs, Reaktionen und mehr.\n\nVERLEIHE DEINEN CHATS DIE RICHTIGE STIMMUNG\nPersonalisiere deine Chats mit einer großen Auswahl von Designs, die rund um beliebte Künstler*innen, Feiertage und mehr aktualisiert werden. \n\n* Meta AI ist derzeit nur in ausgewählten Sprachen und Ländern verfügbar. Weitere kommen bald hinzu.","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=454638411&pricingParameters=STDQ&pg=default&appExtVrsId=893145122"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","idType":"its_id","id":"454638411"},{"locationPosition":0,"locationType":"lockup","name":"Messenger","idType":"its_id","id":"454638411"},{"locationPosition":11,"locationType":"swoosh","name":"Mehr von Meta Platforms, Inc.","idType":"sequential","id":"26"}],"jet_adamId":"454638411","eventType":"click","targetType":"button","targetId":"454638411","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"454638411"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"454638411","purchaseConfiguration":{"$kind":"PurchaseConfiguration","buyParams":"productType=C&price=0&salableAdamId=454638411&pricingParameters=STDQ&pg=default&appExtVrsId=893145122","vendor":"Meta Platforms, Inc.","appName":"Messenger","bundleId":"com.facebook.Messenger","appPlatforms":["phone","pad"],"isPreorder":false,"excludeAttribution":true,"metricsPlatformDisplayStyle":"ios","isRedownload":false,"preflightPackageUrl":null,"isArcadeApp":false,"isHalva":false,"supportsVisionOSCompatibleIOSBinary":false,"remoteDown Meta AI ist dein persönlicher KI-Assistent – deine Verbindung zur Welt. Erhalte nützliche Antworten, praktische Empfehlungen und Inspiration.\n\n• Umfassendere Antworten: Meta AI durchsucht geteilte Inhalte und Beiträge auf Instagram, Facebook und Threads.\n\n• Smart-Shopping: Beschreibe, wonach du suchst, oder mach ein Foto, um Inspiration zu erhalten. Anhand der Creator*innen, denen du folgst, und der Marken, die dir gefallen, bietet dir Meta AI Empfehlungen, die zu deinem Stil passen.\n\n• Neue Orte kennenlernen: Lass dir Restaurants, Freizeitaktivitäten oder Ziele für einen Wochenendausflug empfehlen. Meta AI erstellt Empfehlungen basierend auf Rezensionen, Beiträgen und Trends – mit Bewertungen, Fotos und Details.\n\n• Antworten zu Fotos, Videos, Dokumenten und Dateien erhalten: Mach ein Foto, um sofort Hilfe zu erhalten. Lade Dokumente, PDFs oder Tabellen hoch, um Zusammenfassungen, Vergleiche oder Analysen erstellen zu lassen. Wenn du mehrere Dateien sendest, verarbeitet Meta AI sie zusammen.\n\n• Hilfe in schwierigen Situationen erhalten: Meta AI hilft dir, Sachverhalte logisch zu durchdenken – ob bei großen Entscheidungen oder kurzen Fragen. Aktiviere „Denken\", um komplexe Fragen Schritt für Schritt zu erörtern.\n\n• Privat chatten: Starte einen Inkognito-Chat mit Meta AI, um private, temporäre Unterhaltungen zu führen, die nur du sehen kannst.\n\n• Kreativ werden: Erstelle und teile Vibes – immersive KI-Videos von dir, deinen Freund*innen oder allem, was du dir vorstellen kannst.\n\n• Mit Meta AI sprechen: Chatte mit Meta AI über Sprache oder Text. Sprachunterhaltungen sind schneller und natürlicher und werden in 13 Sprachen unterstützt. Erhalte mit Live AI in Echtzeit Antworten zu allem, was du siehst.\n\n• Die „Freihändig\"-Funktion verwenden: Kopple deine AI Glasses, um persönliche Unterstützung bei deinen alltäglichen Aufgaben zu erhalten. Du brauchst die Meta AI-App als Begleit-App, um deine Meta AI Glasses zu bedienen, Medien zu importieren und zu teilen usw.\n\nMeta AI basiert auf Muse Spark, dem ersten Modell in einer neuen Modellfamilie von Meta Superintelligence Labs. Du kannst Meta Al auf WhatsApp, im Messenger, auf Instagram, Facebook, mit den AI Glasses, in der Meta AI-App und auf meta.ai verwenden.\n\nBestimmte Meta AI-Funktionen sind nur in ausgewählten Ländern und Sprachen verfügbar. Einige Funktionen werden im Laufe der Zeit bereitgestellt. Du möchtest ein Problem melden oder uns Feedback zukommen lassen? Dann schüttle dein Handy und tippe auf „Etwas melden\".","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=1558240027&pricingParameters=STDQ&pg=default&appExtVrsId=893461551"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","idType":"its_id","id":"1558240027"},{"locationPosition":2,"locationType":"lockup","name":"Meta AI","idType":"its_id","id":"1558240027"},{"locationPosition":11,"locationType":"swoosh","name":"Mehr von Meta Platforms, Inc.","idType":"sequential","id":"26"}],"jet_adamId":"1558240027","eventType":"click","targetType":"button","targetId":"1558240027","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"1558240027"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"1558240027","purchaseConfiguration":{"$kind":"PurchaseConfiguration","buyParams":"productType=C&price=0&salableAdamId=1558240027&pricingParameters=STDQ&pg=default&appExtVrsId=893461551","vendor":"Meta Platforms, Inc.","appName":"Meta AI","bundleId":"com.facebook.stellaapp","appPlatforms":["phone","pad"],"isPreorder":false,"excludeAttribution":true,"metricsPlatformDisplayStyle":"ios","isRedownload":false,"preflightPackageUrl":null,"isArcadeApp":false,"isH bnis, das du antippen und berühren kannst … und du kannst ein Gizmo erstellen, indem du es einfach beschreibst.\n\nENTDECKEN\nScrolle durch einen Feed voller Gizmos von Menschen aus aller Welt. Gizmos reagieren auf deine Berührungen und darauf, wie du dein Handy neigst. Sie spielen Soundeffekte ab und können deine Lieblingssongs enthalten. Sie können deine Kamera nutzen oder Fotos aus deiner Mediathek einbinden.\n\nERSTELLEN\nErstelle ein Gizmo, indem du es einfach beschreibst. Öffne den Editor, um es anzupassen und zu verfeinern, bis es genau so ist, wie du es willst. Füge Fotos aus deiner Mediathek hinzu, um ihm eine persönliche Note zu geben. Wenn es fertig ist, teile es auf deinem Profil.\n\nKURATIEREN\nLikes und Kommentare bewirken viel, aber du kannst noch mehr tun. Speichere, remixe und reposte die Gizmos, die du liebst: die besten Rätsel, deine liebsten Selfie-Kameras und Quizze. Entdecke die Community über Playlists von Leuten wie dir.\n\nLade Pocket herunter, um deine eigenen Gizmos zu erstellen und zu teilen!","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=6761221765&pricingParameters=STDQ&pg=default&appExtVrsId=893597820"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","idType":"its_id","id":"6761221765"},{"locationPosition":6,"locationType":"lockup","name":"Pocket: Make Gizmos","idType":"its_id","id":"6761221765"},{"locationPosition":11,"locationType":"swoosh","name":"Mehr von Meta Platforms, Inc.","idType":"sequential","id":"26"}],"jet_adamId":"6761221765","eventType":"click","targetType":"button","targetId":"6761221765","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"6761221765"}},"$k omantics.  Whether you need advice or wanna share your love stories, this romance chatroom and friends chatroom is the place to be.\nHosting a chatroom has never been easier with ShareChat!  Become a chatroom host, create your own vibrant community, lead chatroom battles and curate discussions about the things you're passionate about. Engage with your audience, share insights, and build a community of awesome peeps.\nStay up to date with the latest trends and viral content through ShareChat's curated feeds. Discover trending status, funny memes, inspiring stories, and news that's making waves across the internet. Be the first to know and share the hottest content with your friends and followers.\nExpress yourself creatively with text status and video status features. Choose from a wide range of customizable options to create personalized status updates that reflect your mood, thoughts, and experiences. Share your status with friends, followers, or the entire ShareChat community.\nReady to have a blast?  Download ShareChat now and join the vibrant community, be a part of engaging conversations, and unleash your creativity as you discover the power of ShareChat. Let the chit chat begin!","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=1440640105&pricingParameters=STDQ&pg=default&appExtVrsId=890395157"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"1440640105"},{"locationPosition":0,"locationType":"lockup","name":"ShareChat - Videos & Status","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"1440640105"},{"locationPosition":12,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relat 01","template":"https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/4e/a2/48/4ea2486b-443e-08e4-23e2-b60e3ed8245b/Placeholder.mill/{w}x{h}{c}.{f}","width":1024,"height":1024,"variants":[{"$kind":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.17647058823529413,"green":0.17647058823529413,"blue":0.17647058823529413,"type":"rgb"},"textColor":{"red":0.9294117647058824,"green":0.9294117647058824,"blue":0.9294117647058824,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Beteilige dich am Gespräch","ageRating":"13+","productDescription":"Entdecke neue Perspektiven und unterhalte dich mit anderen auf Threads.\n\nFinde heraus, worüber die Menschen gerade sprechen, von ungewöhnlichen Interessen bis zu großen Momenten. Mit Communitys findest du auf Threads Menschen mit ähnlichen Interessen. Antworte, höre zu, teile selbst etwas oder folge ihnen.\n\nDas kannst du auf Threads tun:\n\n■ Starte einen Thread, teile deine Sichtweise\nBeschäftigt dich etwas? Poste es auf Threads. Teile einen Gedanken, stelle eine Frage oder beginne eine Unterhaltung. Es gibt verschiedene Möglichkeiten, um Dinge mit Text, Bildern, Umfragen, selbstlöschenden Beiträgen und mehr ins Rollen zu bringen.\n\n■ Springe direkt zu den Antworten\nBeteilige dich direkt an der Diskussion, reagiere auf neue Ideen oder beobachte, in welche Richtung sich das Gespräch entwickelt. Jeder Thread ist eine Einladung, dich zu beteiligen.\n\n■ Behalte Trends im Blick\nVon Live-Ergebnissen bis zu entscheidenden Momenten: Mit Threads bist du immer auf dem Laufenden und kannst dich direkt an der Diskussion beteiligen, wenn du etwas zu sagen hast.\n\n■ Du steuerst, welche Inhalte du siehst\nSteuere, wer dir antworten, dich erwähnen oder deine Beiträge sehen kann. Verwende unerwünschte Begriffe, um Beiträge und Antworten herauszufiltern, die Begriffe oder Formulierungen enthalten, die du nicht sehen möchtest. So gestaltest du dein Nutzungserlebnis nach deinen Vorstellungen.\n\n■ Vertiefe deine Interessen\nFolge Freund*innen, Creator*innen und Communitys, die dich interessieren. Threads wurde entwickelt, um neue Perspektiven zu entdecken und miteinander ins Gespräch zu kommen – angefangen mit den Communitys, die dir am wichtigsten sind.\n\n■ Schaffe Verbindungen im Chat\nFühre private Unterhaltungen mit 1:1-Chats und Gruppen-Direktnachrichten. Wenn ein öffentlicher Thread persönlich wird, kannst du ihn in dein Postfach verschieben, um das Gespräch zu vertiefen oder den Teilnehmerkreis einzugrenzen.\n\nMeta Terms: https://www.facebook.com/terms.php\nThreads Supplemental Terms: https://help.instagram.com/769983657850450\nMeta Privacy Policy: https://privacycenter.instagram.com/policy\nThreads Supplemental Privacy Policy: https://help.instagram.com/515230437301944\nInstagram Community Guidelines: https://help.instagram.com/477434105621119\n","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=6446901002&pricingParameters=STDQ&pg=default&appExtVrsId=893453750"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"6446901002"},{"locationPosition":2,"locationType":"lockup","name":"Threads","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"6446901002"},{"locationPosition":12,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"6446901002","eventType":"click","targetType":"button","targetId":"6446901002","platformContext":"iphone","alt_ab2_data":"[]"},"i , zuverlässig und privat und eignet sich deshalb perfekt, um mit deinen Freund*innen und deiner Familie auf der ganzen Welt in Kontakt zu bleiben. Sie funktioniert auf Handys, Tablets und Desktops – selbst bei langsamen Verbindungen – und ist gebührenfrei*.\n\nWeltweit private Nachrichten austauschen und telefonieren\n\nDeine Privatsphäre hat für uns Priorität. Dank der Ende-zu-Ende-Verschlüsselung kannst du sicher sein, dass deine persönlichen Nachrichten und Anrufe nur zwischen dir und der Person, mit der du kommunizierst, ausgetauscht werden. Und niemand, nicht einmal WhatsApp kann sie lesen oder anhören.\n\nSchnell, einfach und sicher kommunizieren\n\nDu brauchst lediglich deine Telefonnummer – keine Benutzernamen oder Anmeldungen erforderlich. Gehe einfach in deine Kontakte auf WhatsApp und starte die Kommunikation. Außerdem kannst du deine anderen Geräte, auch iPads einfach verknüpfen, um nahtlos in Verbindung zu bleiben.\n\nSprach- und Videoanrufe in hoher Qualität\n\nGenieße kostenlose sichere Video- und Sprachanrufe mit bis zu 32 Teilnehmer*innen. Über den Internetdienst deines Telefons oder Tablets kannst du auf allen Geräten telefonieren – selbst bei langsamen Verbindungen.\n\nMit Gruppenchats Kontakt halten\n\nNutze ende-zu-Ende-verschlüsselte Gruppenchats und Anrufe, um mit Freund*innen und Familie in Kontakt zu bleiben. Teile Nachrichten, Fotos, Videos und Dokumente über Handy, Tablet und Desktop. Du kannst auch Anruflinks und die Bildschirmfreigabe verwenden, um Gruppenanrufe und die Zusammenarbeit zu erleichtern.\n\nIn Echtzeit verbunden bleiben\n\nWenn du WhatsApp auf deinem Mobiltelefon verwendest, kannst du deinen Standort mit den Personen in deinen Einzel- oder Gruppenchats teilen. Oder du nimmst eine Sprachnachricht auf, wenn geschriebener Text einfach mal nicht ausreicht.\n\nAlltagsmomente im Status teilen\n\nTeile deinen Alltag mit Personen, die dir wichtig sind. Über den Status kannst du deiner News per Text, Fotos, Videos und GIFs teilen, die nach 24 Stunden wieder verschwinden. Du kannst kontrollieren, wer deinen Status sieht. Wähle einfach aus, mit wem du ihn teilen möchtest – ob mit allen Kontakten oder nur ausgewählten. Erwecke deinen Alltag zum Leben.\n\n* Es können die normalen Datennutzungsgebühren anfallen. Kontaktiere deinen Provider für weitere Informationen.\n\n\n---------------------------------------------------------------------------\n\nFalls du Feedback geben möchtest oder Fragen hast, melde dich bitte über WhatsApp > Einstellungen > Hilfe > Kontaktiere uns.\n\nNutzungsbedingungen: https://www.whatsapp.com/legal/terms-of-service \n\nErfahre mehr zur Privatsphäre bei Nachrichten: https://www.whatsapp.com/privacy \n\nErfahre mehr zur Sicherheit auf WhatsApp: https:https://www.whatsapp.com/security","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=310633997&pricingParameters=STDQ&pg=default&appExtVrsId=893449348"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"310633997"},{"locationPosition":3,"locationType":"lockup","name":"WhatsApp Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"310633997"},{"locationPosition":12,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"310633997","eventType":"click","targetType":"button","targetId":"310633997","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"310633997"}},"$kind":"OfferAction","actionClass":"Off und genieße.\n\nAll die Neuentdeckungen, faszinierenden Wasserfall-GIFs, Zitate, deine gesammelten Tags – all das bist du. Reblogge, was das Zeug hält, und zeige der Welt, wer du bist und was du gut findest. Du entscheidest, wohin es geht. Wir sind die Landkarte, die ihr alle gemeinsam zeichnet. Willkommen zu Hause. Mach es dir gemütlich.\n\nAls Künstler:in kommst du gleich in eine Community, die deine Arbeit versteht und schätzt. Wie ein Online-Atelier, mit vielen Optionen: Ein Portfolio deiner Arbeiten direkt mit Community und sozialer Interaktion. Oder wie ein Online-Zeichentisch, wo du Ideen ausarbeitest, Skizzen teilst und Feedback sammelst. Nimm Aufträge an oder mach bei Challenges wie Goblin Week, Mermay, Julycanthropy und Yeehawgust mit.\nDiskutiere deine Lieblingspinselstärke. Erstelle OC-Art für deine Lieblingsautor:innen auf Tumblr. Verkaufe Drucke (Untersetzer! Tassen! Schnickschnack!) – an deine Zielgruppe, die aktiv über unsere Artist Alley nach solchen Dingen sucht. Erstelle einen Webcomic (hast du schon von Heartstopper gehört? Der hat hier angefangen).\n\nStell dir all das vor, aber für unterwegs. Genau das ist es.\n\n-\n\nWenn du etwas irgendwo schon gesehen hast, ist es wahrscheinlich hier entstanden. Das digitale Bild, das dir nicht mehr aus dem Kopf geht. Der Text, der detailreich etwas erklärt, von dem du nie gedacht hättest, dass du es wissen musst. Dein Dashboard wird zu einer Sammlung all der wunderbaren, unsinnigen, fantastischen Dinge, die du magst. Egal, ob du selbst postest, Herzen vergibst oder in deinen persönlichen Online-Kühlschrank rebloggst. Was auch immer deine Community ist, hier findest du ein Zuhause. \n\nWenn du etwas zu sagen hast – eine brandaktuelle Meinung zum Mond im Sternzeichen Jungfrau, eine Barbie-Fanfiction, ein Bild deiner Schildkröte Harold, das du einfach mit der Welt teilen musst: Versuche dein Glück mit einem Foto, einem Video oder einem Text. Erstelle einen Audio-Eintrag mit deinen Gedanken oder teile deinen aktuellen Lieblingssong über Spotify. Wir haben sogar einen voreingestellten Chat-Eintrag für alle deine falschen Zitate. \n\nRebloggen regt Unterhaltungen an, schafft Witze und hält sie am Laufen – manchmal über die ganze Welt und über Jahre hinweg. Zeit und Raum, gleich hier. Was auch immer du in den sprudelnden Äther schickst, mach dir klar, dass es überall hingelangen kann und wird. (Es sei denn, du nutzt unsere Reblog-Steuerelemente auf Beitragsebene. Privater Blog? Privater Eintrag? Hier ist alles möglich).\n\nTumblr ist das Zuhause der Fandoms. Wir alle haben diesen einen besonderen Blorbo aus unseren Serien. Es gibt Fan-Art, zum  immer wieder Ansehen, Rebloggen und noch einmal Betrachten – oder erstelle selbst eine un teile sie mit der Community.\nDu kannst deine Lieblingsautor:innen von ao3 lesen *und* ihre OC-Art auf Tumblr sehen *und* mit ihnen über die Handlung diskutieren. Pokémon? Na klar. Marvel? Hier. Kpop? Check. Supernatural? Natürlich. Minecraft? Wartet schon. Star Wars? Ja! Doctor Who? Doctor YOU! Du verstehst schon: Hier gibt es alles. \n\nDas ganze Universum tummelt sich hier. Wenn dir das Erstellen, Rebloggen, Versenden und Kuratieren viel zu viel ist, dann schau mal bei tips.tumblr.com vorbei. Dort führt dich Cat Frazier von animatedtext.tumblr.com durch die Tumblr-Etikette.\n\nAlso: Melde dich an, verliebe dich in ein Artwork, folge ein paar Tags und finde deinen Platz auf dem Dashboard. Dann reblogge, like und poste nach Herzenslust. Oder wandle einfach durch den Traum, den du dir gerade selbst geschaffen hast – du hast den Schlüssel zu deinem Reich.\n\nTwitter: https://twitter.com/tumblr/\n\nInstagram: https://www.instagram.com/tumblr/\n\nNutzungsbedingungen: https://www.tumblr.com/policy/terms-of-service","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType= e to obtain substantial income. With monetization, Clapper now offers a practical path for content creators to sustain themselves on an ad-free short video platform.\n\n*What can you expect?*\na) Post Video: Short video is the foundation of Clapper where users can post videos for up to 3 minutes and you also have the option to use our additional features like add text, video trimming, music, and other effects. Interact, sing, dance, talk about your day, send messages to friends and followers.\nb) Duet Live: Apart from the solo Live option, duet live feature allows you to bring your follower on live and interact in real-time.\nc) Radio: Imagine an auditorium but with only vocals. This is the audio-only feature that allows you to create a room of up to 2000 listeners and up to 20 speakers to 'talk'\nd) Group: Create a community of your super fans where you can share interact 1:1 with them.\n\nDownload now and discover the heartbeat of your local area and around the world.\nWebsite: https://clapperapp.com/\nFacebook: https://facebook.com/theclapperapp\nInstagram: https://instagram.com/theclapperapp\nTwitter: https://twitter.com/theclapperapp\nEmail: contact@clapperapp.com \n","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=1522122685&pricingParameters=STDQ&pg=default&appExtVrsId=893219024"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"1522122685"},{"locationPosition":6,"locationType":"lockup","name":"Clapper: Video, Live, Chat","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"1522122685"},{"locationPosition":12,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id": 9411764705883,"green":0.43137254901960786,"blue":0.9647058823529412,"type":"rgb"},"textColor":{"red":0.08235294117647059,"green":0.08235294117647059,"blue":0.08627450980392157,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Video Anrufen und Chatten","ageRating":"13+","productDescription":"\"Rakuten Viber ist eine sichere, unterhaltsame und spannende Messaging- und Anruf-App, die über eine Milliarde Menschen weltweit verbindet!\n\nMit Rakuten Viber ist alles möglich: Gruppenchats, verschwindende Nachrichten, Erinnerungen und vieles mehr:\n\nSende kostenlos Nachrichten\nEs war noch nie einfacher, miteinander in Kontakt zu bleiben. Sende kostenlose Text-, Foto-, Sticker-, GIF-, Sprach- oder Videonachrichten, sowie viele andere Arten von Dateien.\n\nGenieße kostenlose Audio- und Videoanrufe\nGenieße unbegrenzte, kostenlose Viber-zu-Viber-Anrufe zu jedem auf der Welt. Du kannst sogar bis zu 60 Personen gleichzeitig anrufen! Ideal, um mit Freunden, Familie und Kollegen in Kontakt zu bleiben :)\n\nFühle dich sicher mit der Ende-zu-Ende-Verschlüsselung\nDie Ende-zu-Ende-Verschlüsselung ist standardmäßig für alle 1-zu-1-Anrufe, Chats und Gruppenchats aktiviert und ermöglicht dir eine sichere Kommunikation mit der Gewissheit, dass alle Nachrichten privat bleiben. Niemand, nicht einmal Rakuten Viber, kann deine Nachrichten lesen.\n\nMit Viber Out kostengünstig ins Festnetz telefonieren\nRufe mit dem kostengünstigen, internationalen Anrufdienst von Viber Out jedes Festnetz- oder Mobiltelefon an. Hole dir ein Viber Out-Abonnement, um in ein bestimmtes Land zu telefonieren, oder halte dir alle Optionen offen und kaufe Minuten, die du für alle Länder der Welt anwenden kannst.\n\nEröffne einen Gruppenchat\nBleibe in Kontakt mit Freunden, Familie und Kollegen, indem du einen Gruppenchat für bis zu 250 Mitglieder eröffnest. Nutze Umfragen und Quizze, @Erwähnungen und Emoji-Reaktionen, um das Beste aus deiner Gruppe herauszuholen!\n\nNutze unsere Linsen, GIFs und Sticker, um dich auszudrücken\nPersonalisiere deine Chats! Werde mit lustigen, witzigen und verschönernden Viber-Linsen kreativ. Außerdem erwarten dich GIFs und über 55.000 Sticker – Du kannst sogar deine eigenen erstellen.\n\nVerwende verschwindende Nachrichten\nSende verschwindende Nachrichten in deinen Einzel- und Gruppenchats, indem du für jede Nachricht einen Timer einstellst. Du kannst wählen, wie lange eine Nachricht nach dem Öffnen verfügbar sein soll – 10 Sekunden, 1 Minute oder bis zu 1 Tag!\n\nVernetze dich in Communities und Kanälen\nOb Sport, Nachrichten, Kochen, Reisen oder Unterhaltung – hole dir die Inhalte, die dich wirklich interessieren, und vernetze dich mit anderen Menschen, die ähnlichen Interessen haben. Du kannst sogar deine eigene Community oder deinen eigenen Kanal starten und eine weltweite Fangemeinde aufbauen.\n\nChatte mit KI-Bots\nDie KI-Bots von Rakuten Viber beantworten alle deine Fragen und verwandeln deine Worte in wunderschöne Kunst. Du kannst auch verifizierte Bots finden, um die neuesten Fashion-News zu erhalten, deine Reisen zu buchen und sogar deine Stromrechnungen zu bezahlen!\n\nReaktionen auf Nachrichten\nReagiere mit Emojis auf Nachrichten, um in Chats genau zum Ausdruck zu bringen, wie du dich fühlen!\n\nErstelle Notizen und Erinnerungen\nLeite interessante Nachrichten weiter, speichere sinnvolle Links und halte deine Gedanken in Meine Notizen fest. Du kannst auch Erinnerungen einstellen, um sicherzugehen, dass du keine wichtigen Aufgaben und Ereignisse vergisst.\n\nRakuten Viber ist Teil der Rakuten-Gruppe, einem weltweit führenden Anbieter von E-Commerce- und Finanzdienstleistungen.\n\nAllgemeine Geschäftsbedingungen und Richtlinien: https://www.viber.com/terms/\"","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"f image/thumb/PurpleSource221/v4/4b/8c/11/4b8c112c-404c-9529-6f9b-ecb92eedc42c/Placeholder.mill/{w}x{h}{c}.{f}","width":1024,"height":1024,"variants":[{"$kind":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.996078431372549,"green":0.996078431372549,"blue":0.996078431372549,"type":"rgb"},"textColor":{"red":0.047058823529411764,"green":0.13725490196078433,"blue":0.27058823529411763,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Private. Secure. Video Calls","ageRating":"13+","productDescription":"imo ist eine KOSTENLOSE, einfache und sichere App für internationale Videoanrufe und Instant Messaging. Sie wird von über 200 Millionen Menschen in mehr als 170 Ländern und Regionen genutzt und unterstützt 62 Sprachen. imo bietet innovative Lösungen für nahtlose Kommunikation und ermöglicht es Menschen, wichtige Momente miteinander zu teilen.\n\n■ Kostenlose und HD-Videoanrufe\nJeden Tag werden über imo mehr als 300 Millionen Videoanrufe getätigt. Tätige KOSTENLOS internationale Anrufe mit deinen Freunden und deiner Familie. Du kannst auch Gruppenchats mit Freunden erstellen und kostenlos mit ihnen in einer Gruppe sprechen. Erlebe kristallklare und sofortige Videoanrufe in HD-Qualität mit Freunden und Verwandten auf der ganzen Welt. Vermeide SMS- und Telefongebühren. Keine Gebühren oder Abos für jede Nachricht oder jeden Anruf, auf jeden Fall kostenlos.\n\n■ Internationale und zuverlässige Anrufe\nKonsistente und stabile internationale Audio- oder Videoanrufe über eine 2G-, 3G-, 4G-, 5G- oder WLAN-Verbindung*. Sende Text- oder Sprachnachrichten auf der ganzen Welt an deine Freunde, deine Familie und andere Kontakten oder tätige Anrufe mit diesen, einfach und schnell, auch bei schlechtem Netzsignal.\n\n■ imo Messenger\nVerbinde dich mit deinen Liebsten durch Anrufe und Nachrichten. Du kannst Fotos und Videos austauschen und Sprachnachrichten oder Dokumente aller Art (DOC, MP3, ZIP, PDF usw.) senden und empfangen. Alle deine Nachrichten und Dateien können sicher in der imo Cloud synchronisiert werden, um Speicherplatz auf deinem Telefon freizugeben.\n\n■ Chat-Privatsphäre\nimo gewährleistet maximale Privatsphäre für deine Nachrichten. Wir nutzen Time Machine, Verschwindende Nachricht, SecretChat, Block Screenshot und Ende-zu-Ende-Verschlüsselung, um deine Chat-Privatsphäre zu verbessern. Du kannst alle Chat-Nachrichten löschen, Nachrichten-Timer einstellen und Screenshots, Kopien, Freigaben und Downloads für private Chats blockieren.\n\n■ Übersetzung von Sofortnachrichten\nÜbersetze mühelos für nahtlose Unterhaltungen in verschiedenen Sprachen. imo bietet dir eine bequeme Sofortübersetzung für Textnachrichten.\n\n■ Hadsch- und Omrah-Assistent\nWir helfen Schritt für Schritt bei der Durchführung einer Omrah und machen Hadsch und Omrah für Muslime weltweit einfacher und sicherer. Der Omrah-Assistent hilft Pilgern mit Informationen über die Omrah-Prozesse durch Omrah-Tipps, die Weitergabe von Omrah-Standorten, Ein-Klick-Navigation und Kommunikationsmöglichkeiten für Pilger.\n\n■ Globaler Webanfruf\nTeile einen einzigen Link für kostenlose plattformübergreifende Anrufe. Basierend auf der WebRTC-Technologie ermöglichen wir unseren Nutzern klare und unterbrechungsfreie Sprachanrufe und Nachrichten mit bzw. an die Liebsten, unabhängig davon, ob sie imo-Nutzer sind oder nicht.\n\n■ VoiceClub\nMit VoiceClub kannst du Freundschaften schließen und dein Glück teilen. Mit Voiceclub kann jeder seinen eigenen Raum erstellen oder den Räumen anderer beitreten, um den Chat zu genießen oder sich anzuhören. In den Kanälen finden auch Veranstaltungen wie Talentshows, Talkshows, Wettbewerbe, Spiele oder Zeremonien statt.\n\n* Es können Datengebühren anfallen. Erkundige dich bei deinem Anbieter nach den Einzelheiten.\n\nOffizielle Website: https://imo.im/\nDatenschutzrichtlinie: https://imo.im/policies/privacy_policy.html\nServicebedingungen: https://imo.im/policies/terms_of_service.html\nFeedback-Center: https://activity.imoim.net/feedback/index.html","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=336435697&pricingParameters=STDQ&pg=default&appExtVrsId=893453055"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"336435697"},{"locationPosition":9,"locationType":"lockup","name":"imo Videoanrufe","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"336435697"},{"locationPosition":12,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"336435697","eventType":"click","targetType":"button","targetId":"336435697","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"336435697"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"336435697","purchaseConfiguration":{"$kind":"PurchaseConfiguration","buyParams":"productType=C&price=0&salableAdamId=336435697&pricingParameters=STDQ&pg=default&appExtVrsId=893453055","vendor":"imo.im","appName":"imo Videoanrufe","bundleId":"imoimiphone","appPlatforms":["phone","pad"],"isPreorder":false,"excludeAttribution":true,"metricsPlatformDisplayStyle":"ios","isRedownload":false,"preflightPackageUrl":null,"isArcadeApp":false,"isHalva":false,"supportsVisionOSCompatibleIOSBinary":false,"remoteDownloadIdentifiers":[],"hasMacIPAPackage":false,"contentRating":313,"p  antworten, dich erwähnen oder deine Beiträge sehen kann. Verwende unerwünschte Begriffe, um Beiträge und Antworten herauszufiltern, die Begriffe oder Formulierungen enthalten, die du nicht sehen möchtest. So gestaltest du dein Nutzungserlebnis nach deinen Vorstellungen.\n\n■ Vertiefe deine Interessen\nFolge Freund*innen, Creator*innen und Communitys, die dich interessieren. Threads wurde entwickelt, um neue Perspektiven zu entdecken und miteinander ins Gespräch zu kommen – angefangen mit den Communitys, die dir am wichtigsten sind.\n\n■ Schaffe Verbindungen im Chat\nFühre private Unterhaltungen mit 1:1-Chats und Gruppen-Direktnachrichten. Wenn ein öffentlicher Thread persönlich wird, kannst du ihn in dein Postfach verschieben, um das Gespräch zu vertiefen oder den Teilnehmerkreis einzugrenzen.\n\nMeta Terms: https://www.facebook.com/terms.php\nThreads Supplemental Terms: https://help.instagram.com/769983657850450\nMeta Privacy Policy: https://privacycenter.instagram.com/policy\nThreads Supplemental Privacy Policy: https://help.instagram.com/515230437301944\nInstagram Community Guidelines: https://help.instagram.com/477434105621119\n","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=6446901002&pricingParameters=STDQ&pg=default&appExtVrsId=893453750"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"6446901002"},{"locationPosition":2,"locationType":"lockup","name":"Threads","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"6446901002"},{"locationPosition":13,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"6446901002"," ür Messaging und Anrufe, die von über 2 Milliarden Menschen in über 180 Ländern verwendet wird. Die App ist einfach, zuverlässig und privat und eignet sich deshalb perfekt, um mit deinen Freund*innen und deiner Familie auf der ganzen Welt in Kontakt zu bleiben. Sie funktioniert auf Handys, Tablets und Desktops – selbst bei langsamen Verbindungen – und ist gebührenfrei*.\n\nWeltweit private Nachrichten austauschen und telefonieren\n\nDeine Privatsphäre hat für uns Priorität. Dank der Ende-zu-Ende-Verschlüsselung kannst du sicher sein, dass deine persönlichen Nachrichten und Anrufe nur zwischen dir und der Person, mit der du kommunizierst, ausgetauscht werden. Und niemand, nicht einmal WhatsApp kann sie lesen oder anhören.\n\nSchnell, einfach und sicher kommunizieren\n\nDu brauchst lediglich deine Telefonnummer – keine Benutzernamen oder Anmeldungen erforderlich. Gehe einfach in deine Kontakte auf WhatsApp und starte die Kommunikation. Außerdem kannst du deine anderen Geräte, auch iPads einfach verknüpfen, um nahtlos in Verbindung zu bleiben.\n\nSprach- und Videoanrufe in hoher Qualität\n\nGenieße kostenlose sichere Video- und Sprachanrufe mit bis zu 32 Teilnehmer*innen. Über den Internetdienst deines Telefons oder Tablets kannst du auf allen Geräten telefonieren – selbst bei langsamen Verbindungen.\n\nMit Gruppenchats Kontakt halten\n\nNutze ende-zu-Ende-verschlüsselte Gruppenchats und Anrufe, um mit Freund*innen und Familie in Kontakt zu bleiben. Teile Nachrichten, Fotos, Videos und Dokumente über Handy, Tablet und Desktop. Du kannst auch Anruflinks und die Bildschirmfreigabe verwenden, um Gruppenanrufe und die Zusammenarbeit zu erleichtern.\n\nIn Echtzeit verbunden bleiben\n\nWenn du WhatsApp auf deinem Mobiltelefon verwendest, kannst du deinen Standort mit den Personen in deinen Einzel- oder Gruppenchats teilen. Oder du nimmst eine Sprachnachricht auf, wenn geschriebener Text einfach mal nicht ausreicht.\n\nAlltagsmomente im Status teilen\n\nTeile deinen Alltag mit Personen, die dir wichtig sind. Über den Status kannst du deiner News per Text, Fotos, Videos und GIFs teilen, die nach 24 Stunden wieder verschwinden. Du kannst kontrollieren, wer deinen Status sieht. Wähle einfach aus, mit wem du ihn teilen möchtest – ob mit allen Kontakten oder nur ausgewählten. Erwecke deinen Alltag zum Leben.\n\n* Es können die normalen Datennutzungsgebühren anfallen. Kontaktiere deinen Provider für weitere Informationen.\n\n\n---------------------------------------------------------------------------\n\nFalls du Feedback geben möchtest oder Fragen hast, melde dich bitte über WhatsApp > Einstellungen > Hilfe > Kontaktiere uns.\n\nNutzungsbedingungen: https://www.whatsapp.com/legal/terms-of-service \n\nErfahre mehr zur Privatsphäre bei Nachrichten: https://www.whatsapp.com/privacy \n\nErfahre mehr zur Sicherheit auf WhatsApp: https:https://www.whatsapp.com/security","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=310633997&pricingParameters=STDQ&pg=default&appExtVrsId=893449348"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"310633997"},{"locationPosition":3,"locationType":"lockup","name":"WhatsApp Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"310633997"},{"locationPosition":13,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"310633997","eventType":"click","targetType":"button","targetId":"310633997","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"to wischen: Gute alte Internet-Vibes. Fandoms, soweit das Auge reicht. Memes, ohne Ende. Bring dich ein  oder scrolle und genieße.\n\nAll die Neuentdeckungen, faszinierenden Wasserfall-GIFs, Zitate, deine gesammelten Tags – all das bist du. Reblogge, was das Zeug hält, und zeige der Welt, wer du bist und was du gut findest. Du entscheidest, wohin es geht. Wir sind die Landkarte, die ihr alle gemeinsam zeichnet. Willkommen zu Hause. Mach es dir gemütlich.\n\nAls Künstler:in kommst du gleich in eine Community, die deine Arbeit versteht und schätzt. Wie ein Online-Atelier, mit vielen Optionen: Ein Portfolio deiner Arbeiten direkt mit Community und sozialer Interaktion. Oder wie ein Online-Zeichentisch, wo du Ideen ausarbeitest, Skizzen teilst und Feedback sammelst. Nimm Aufträge an oder mach bei Challenges wie Goblin Week, Mermay, Julycanthropy und Yeehawgust mit.\nDiskutiere deine Lieblingspinselstärke. Erstelle OC-Art für deine Lieblingsautor:innen auf Tumblr. Verkaufe Drucke (Untersetzer! Tassen! Schnickschnack!) – an deine Zielgruppe, die aktiv über unsere Artist Alley nach solchen Dingen sucht. Erstelle einen Webcomic (hast du schon von Heartstopper gehört? Der hat hier angefangen).\n\nStell dir all das vor, aber für unterwegs. Genau das ist es.\n\n-\n\nWenn du etwas irgendwo schon gesehen hast, ist es wahrscheinlich hier entstanden. Das digitale Bild, das dir nicht mehr aus dem Kopf geht. Der Text, der detailreich etwas erklärt, von dem du nie gedacht hättest, dass du es wissen musst. Dein Dashboard wird zu einer Sammlung all der wunderbaren, unsinnigen, fantastischen Dinge, die du magst. Egal, ob du selbst postest, Herzen vergibst oder in deinen persönlichen Online-Kühlschrank rebloggst. Was auch immer deine Community ist, hier findest du ein Zuhause. \n\nWenn du etwas zu sagen hast – eine brandaktuelle Meinung zum Mond im Sternzeichen Jungfrau, eine Barbie-Fanfiction, ein Bild deiner Schildkröte Harold, das du einfach mit der Welt teilen musst: Versuche dein Glück mit einem Foto, einem Video oder einem Text. Erstelle einen Audio-Eintrag mit deinen Gedanken oder teile deinen aktuellen Lieblingssong über Spotify. Wir haben sogar einen voreingestellten Chat-Eintrag für alle deine falschen Zitate. \n\nRebloggen regt Unterhaltungen an, schafft Witze und hält sie am Laufen – manchmal über die ganze Welt und über Jahre hinweg. Zeit und Raum, gleich hier. Was auch immer du in den sprudelnden Äther schickst, mach dir klar, dass es überall hingelangen kann und wird. (Es sei denn, du nutzt unsere Reblog-Steuerelemente auf Beitragsebene. Privater Blog? Privater Eintrag? Hier ist alles möglich).\n\nTumblr ist das Zuhause der Fandoms. Wir alle haben diesen einen besonderen Blorbo aus unseren Serien. Es gibt Fan-Art, zum  immer wieder Ansehen, Rebloggen und noch einmal Betrachten – oder erstelle selbst eine un teile sie mit der Community.\nDu kannst deine Lieblingsautor:innen von ao3 lesen *und* ihre OC-Art auf Tumblr sehen *und* mit ihnen über die Handlung diskutieren. Pokémon? Na klar. Marvel? Hier. Kpop? Check. Supernatural? Natürlich. Minecraft? Wartet schon. Star Wars? Ja! Doctor Who? Doctor YOU! Du verstehst schon: Hier gibt es alles. \n\nDas ganze Universum tummelt sich hier. Wenn dir das Erstellen, Rebloggen, Versenden und Kuratieren viel zu viel ist, dann schau mal bei tips.tumblr.com vorbei. Dort führt dich Cat Frazier von animatedtext.tumblr.com durch die Tumblr-Etikette.\n\nAlso: Melde dich an, verliebe dich in ein Artwork, folge ein paar Tags und finde deinen Platz auf dem Dashboard. Dann reblogge, like und poste nach Herzenslust. Oder wandle einfach durch den Traum, den du dir gerade selbst geschaffen hast – du hast den Schlüssel zu deinem Reich.\n\nTwitter: https://twitter.com/tumblr/\n\nInstagram: https://www.instagram.com/tumblr/\n\nNutzungsbedingungen: https://www.tumblr.com/policy/terms-of-service","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false :[{"$kind":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.5529411764705883,"green":0.43137254901960786,"blue":0.9647058823529412,"type":"rgb"},"textColor":{"red":0.08235294117647059,"green":0.08235294117647059,"blue":0.08627450980392157,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Video Anrufen und Chatten","ageRating":"13+","productDescription":"\"Rakuten Viber ist eine sichere, unterhaltsame und spannende Messaging- und Anruf-App, die über eine Milliarde Menschen weltweit verbindet!\n\nMit Rakuten Viber ist alles möglich: Gruppenchats, verschwindende Nachrichten, Erinnerungen und vieles mehr:\n\nSende kostenlos Nachrichten\nEs war noch nie einfacher, miteinander in Kontakt zu bleiben. Sende kostenlose Text-, Foto-, Sticker-, GIF-, Sprach- oder Videonachrichten, sowie viele andere Arten von Dateien.\n\nGenieße kostenlose Audio- und Videoanrufe\nGenieße unbegrenzte, kostenlose Viber-zu-Viber-Anrufe zu jedem auf der Welt. Du kannst sogar bis zu 60 Personen gleichzeitig anrufen! Ideal, um mit Freunden, Familie und Kollegen in Kontakt zu bleiben :)\n\nFühle dich sicher mit der Ende-zu-Ende-Verschlüsselung\nDie Ende-zu-Ende-Verschlüsselung ist standardmäßig für alle 1-zu-1-Anrufe, Chats und Gruppenchats aktiviert und ermöglicht dir eine sichere Kommunikation mit der Gewissheit, dass alle Nachrichten privat bleiben. Niemand, nicht einmal Rakuten Viber, kann deine Nachrichten lesen.\n\nMit Viber Out kostengünstig ins Festnetz telefonieren\nRufe mit dem kostengünstigen, internationalen Anrufdienst von Viber Out jedes Festnetz- oder Mobiltelefon an. Hole dir ein Viber Out-Abonnement, um in ein bestimmtes Land zu telefonieren, oder halte dir alle Optionen offen und kaufe Minuten, die du für alle Länder der Welt anwenden kannst.\n\nEröffne einen Gruppenchat\nBleibe in Kontakt mit Freunden, Familie und Kollegen, indem du einen Gruppenchat für bis zu 250 Mitglieder eröffnest. Nutze Umfragen und Quizze, @Erwähnungen und Emoji-Reaktionen, um das Beste aus deiner Gruppe herauszuholen!\n\nNutze unsere Linsen, GIFs und Sticker, um dich auszudrücken\nPersonalisiere deine Chats! Werde mit lustigen, witzigen und verschönernden Viber-Linsen kreativ. Außerdem erwarten dich GIFs und über 55.000 Sticker – Du kannst sogar deine eigenen erstellen.\n\nVerwende verschwindende Nachrichten\nSende verschwindende Nachrichten in deinen Einzel- und Gruppenchats, indem du für jede Nachricht einen Timer einstellst. Du kannst wählen, wie lange eine Nachricht nach dem Öffnen verfügbar sein soll – 10 Sekunden, 1 Minute oder bis zu 1 Tag!\n\nVernetze dich in Communities und Kanälen\nOb Sport, Nachrichten, Kochen, Reisen oder Unterhaltung – hole dir die Inhalte, die dich wirklich interessieren, und vernetze dich mit anderen Menschen, die ähnlichen Interessen haben. Du kannst sogar deine eigene Community oder deinen eigenen Kanal starten und eine weltweite Fangemeinde aufbauen.\n\nChatte mit KI-Bots\nDie KI-Bots von Rakuten Viber beantworten alle deine Fragen und verwandeln deine Worte in wunderschöne Kunst. Du kannst auch verifizierte Bots finden, um die neuesten Fashion-News zu erhalten, deine Reisen zu buchen und sogar deine Stromrechnungen zu bezahlen!\n\nReaktionen auf Nachrichten\nReagiere mit Emojis auf Nachrichten, um in Chats genau zum Ausdruck zu bringen, wie du dich fühlen!\n\nErstelle Notizen und Erinnerungen\nLeite interessante Nachrichten weiter, speichere sinnvolle Links und halte deine Gedanken in Meine Notizen fest. Du kannst auch Erinnerungen einstellen, um sicherzugehen, dass du keine wichtigen Aufgaben und Ereignisse vergisst.\n\nRakuten Viber ist Teil der Rakuten-Gruppe, einem weltweit führenden Anbieter von E-Commerce- und Finanzdienstleistungen.\n\nAllgemeine Geschäftsbedingungen und Richtlinien: https://www.viber.com/terms/\"","buttonActio :"6986","decorations":[],"icon":{"$kind":"Artwork","crop":"Icon.ApSiOS01","template":"https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/4b/8c/11/4b8c112c-404c-9529-6f9b-ecb92eedc42c/Placeholder.mill/{w}x{h}{c}.{f}","width":1024,"height":1024,"variants":[{"$kind":"ArtworkVariant","format":"jpeg","quality":70,"supportsWideGamut":false}],"backgroundColor":{"red":0.996078431372549,"green":0.996078431372549,"blue":0.996078431372549,"type":"rgb"},"textColor":{"red":0.047058823529411764,"green":0.13725490196078433,"blue":0.27058823529411763,"type":"rgb"},"style":"roundedRectPrerendered"},"isIOSBinaryMacOSCompatible":false,"useAdsLocale":false,"tertiaryTitle":null,"tertiaryTitleAction":null,"tertiaryTitleArtwork":null,"developerTagline":"Private. Secure. Video Calls","ageRating":"13+","productDescription":"imo ist eine KOSTENLOSE, einfache und sichere App für internationale Videoanrufe und Instant Messaging. Sie wird von über 200 Millionen Menschen in mehr als 170 Ländern und Regionen genutzt und unterstützt 62 Sprachen. imo bietet innovative Lösungen für nahtlose Kommunikation und ermöglicht es Menschen, wichtige Momente miteinander zu teilen.\n\n■ Kostenlose und HD-Videoanrufe\nJeden Tag werden über imo mehr als 300 Millionen Videoanrufe getätigt. Tätige KOSTENLOS internationale Anrufe mit deinen Freunden und deiner Familie. Du kannst auch Gruppenchats mit Freunden erstellen und kostenlos mit ihnen in einer Gruppe sprechen. Erlebe kristallklare und sofortige Videoanrufe in HD-Qualität mit Freunden und Verwandten auf der ganzen Welt. Vermeide SMS- und Telefongebühren. Keine Gebühren oder Abos für jede Nachricht oder jeden Anruf, auf jeden Fall kostenlos.\n\n■ Internationale und zuverlässige Anrufe\nKonsistente und stabile internationale Audio- oder Videoanrufe über eine 2G-, 3G-, 4G-, 5G- oder WLAN-Verbindung*. Sende Text- oder Sprachnachrichten auf der ganzen Welt an deine Freunde, deine Familie und andere Kontakten oder tätige Anrufe mit diesen, einfach und schnell, auch bei schlechtem Netzsignal.\n\n■ imo Messenger\nVerbinde dich mit deinen Liebsten durch Anrufe und Nachrichten. Du kannst Fotos und Videos austauschen und Sprachnachrichten oder Dokumente aller Art (DOC, MP3, ZIP, PDF usw.) senden und empfangen. Alle deine Nachrichten und Dateien können sicher in der imo Cloud synchronisiert werden, um Speicherplatz auf deinem Telefon freizugeben.\n\n■ Chat-Privatsphäre\nimo gewährleistet maximale Privatsphäre für deine Nachrichten. Wir nutzen Time Machine, Verschwindende Nachricht, SecretChat, Block Screenshot und Ende-zu-Ende-Verschlüsselung, um deine Chat-Privatsphäre zu verbessern. Du kannst alle Chat-Nachrichten löschen, Nachrichten-Timer einstellen und Screenshots, Kopien, Freigaben und Downloads für private Chats blockieren.\n\n■ Übersetzung von Sofortnachrichten\nÜbersetze mühelos für nahtlose Unterhaltungen in verschiedenen Sprachen. imo bietet dir eine bequeme Sofortübersetzung für Textnachrichten.\n\n■ Hadsch- und Omrah-Assistent\nWir helfen Schritt für Schritt bei der Durchführung einer Omrah und machen Hadsch und Omrah für Muslime weltweit einfacher und sicherer. Der Omrah-Assistent hilft Pilgern mit Informationen über die Omrah-Prozesse durch Omrah-Tipps, die Weitergabe von Omrah-Standorten, Ein-Klick-Navigation und Kommunikationsmöglichkeiten für Pilger.\n\n■ Globaler Webanfruf\nTeile einen einzigen Link für kostenlose plattformübergreifende Anrufe. Basierend auf der WebRTC-Technologie ermöglichen wir unseren Nutzern klare und unterbrechungsfreie Sprachanrufe und Nachrichten mit bzw. an die Liebsten, unabhängig davon, ob sie imo-Nutzer sind oder nicht.\n\n■ VoiceClub\nMit VoiceClub kannst du Freundschaften schließen und dein Glück teilen. Mit Voiceclub kann jeder seinen eigenen Raum erstellen oder den Räumen anderer beitreten, um den Chat zu genießen oder sich anzuhören. In den Kanälen finden auch Veranstaltungen wie Talentshows, Talkshows, Wettbewerbe, Spiele oder Zeremonien statt.\n\n* Es können Datengebühren anfallen. Erkundige dich bei deinem Anbieter nach den Einzelheiten.\n\nOffizielle Website: https://imo.im/\nDatenschutzrichtlinie: https://imo.im/policies/privacy_policy.html\nServicebedingungen: https://imo.im/policies/terms_of_service.html\nFeedback-Center: https://activity.imoim.net/feedback/index.html","buttonAction":{"title":"Laden","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=336435697&pricingParameters=STDQ&pg=default&appExtVrsId=893453055"},"location":[{"locationPosition":0,"locationType":"button","name":"Laden","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"336435697"},{"locationPosition":9,"locationType":"lockup","name":"imo Videoanrufe","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"336435697"},{"locationPosition":13,"locationType":"similarItems","name":"Das gefällt dir vielleicht auch","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"336435697","eventType":"click","targetType":"button","targetId":"336435697","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"336435697"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"336435697","purchaseConfiguration":{"$kind":"PurchaseConfiguration","buyParams":"productType=C&price=0&salableAdamId=336435697&pricingParameters=STDQ&pg=default&appExtVrsId=893453055","vendor":"imo.im","appName":"imo Videoanrufe","bundleId":"imoimiphone","appPlatforms":["phone","pad"],"isPreorder":false,"excludeAttribution":true,"metricsPlatformDisplayStyle":"ios","isRedownload":false,"preflightPackageUrl":null,"isArcadeApp":false,"isHalva":false,"suppor
