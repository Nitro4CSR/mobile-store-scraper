eep you in contact\n\nStay close to friends and family through end-to-end encrypted group chats and calls. Share messages, photos, videos and documents across mobile, tablet, and desktop. You can also use call links and screen-sharing to make group calls and collaboration easy.\n\nStay connected in real time\n\nYou can share your location with those in your individual or group chats while using WhatsApp on your mobile phone. Or record a voice message for those moments when just text isn't good enough.\n\nShare daily moments through Status\n\nShare your everyday life with those who matter. With Status you can share text, photos, video, and GIF updates that disappear after 24 hours. You're always in control of who sees your status. Just choose who you want to share it with - all your contacts or selected ones. And bring your everyday to life.\n\n*Data charges may apply. Contact your provider for details.\n\n\n---------------------------------------------------------------------------\n\nIf you have any feedback or questions, please go to WhatsApp > Settings > Help > Contact Us\n\nTerms of Service: https://www.whatsapp.com/legal/terms-of-service \n\nLearn more about messaging privately: https://www.whatsapp.com/privacy \n\nLearn more about WhatsApp safety: https://www.whatsapp.com/security","mediaType":"text/plain","style":"standard","alignment":"localized","isCollapsed":true,"suppressVerticalMargins":false,"wantsCollapsedNewlines":true},"developerAction":{"title":"WhatsApp Inc.","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"actionType":"navigate","actionUrl":"https://apps.apple.com/us/developer/whatsapp-inc/id310634000","location":[{"locationPosition":0,"locationType":"button","name":"WhatsApp Inc.","idType":"its_id","id":"310634000"}],"eventType":"click","targetType":"button","targetId":"310634000","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRes language":"en-US","platform":"iphone","id":"310633997","see-all":"reviews","$kind":"SeeAllPageIntent"}},"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"title":"Ratings & Reviews","titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false,"id":"productRatings"},"allProductReviews":{"$kind":"Shelf","impressionMetrics":null,"contentType":"productReview","marker":null,"items":[{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"13657831289","title":"WhatsApp not bad","contents":"WhatsApp’s not bad at all—it’s actually great for what it does. End-to-end encryption keeps your actual messages and calls private (no one, not even Meta, can read them), and it’s super reliable for texting, voice notes, video calls, groups, and sharing pics/videos across the world without paying extra. Works flawlessly on slow connections, syncs across devices, and the disappearing messages + status features make staying connected fun and easy. Love it for family chats, quick check-ins with friends abroad, and even some work stuff—simple, fast, no ads in chats.\nBut let’s be real: It’s owned by Meta (Facebook), so there are legit privacy dangers. They collect a ton of metadata (who you talk to, when, how often, your phone number, IP address, device info), and that gets shared within Meta for “improving services” or ads elsewhere. Backups aren’t encrypted by default (turn that on!), business chats can feed into Meta’s ecosystem, and features like Meta AI aren’t fully private. Scams/spam groups pop up too often, and if you’re super privacy-focused, it’s not Signal-level secure.\nStill, for everyday use? It’s one of the best out there—billions trust it daily for a reason. Just stay aware, tweak your privacy settings (disable link previews, limit profile visibility, enable 2-step verification), and use it smart. 4.5 stars—love the app, cautious about the company.\nNickname: Ed Bradwayway “Dad Warrior”","rating":5,"reviewerName":"Ed Bradway “Dad Warrior”","date":"2026-01-21T04:48:38.000Z","dateText":"* null *","dateAuthorText":"* null * · Ed Bradway “Dad Warrior”","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"2","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"13657831289","title":"WhatsApp not bad","contents":"WhatsApp’s not bad at all—it’s actually great for what it does. End-to-end encryption keeps your actual messages and calls private (no one, not even Meta, can read them), and it’s super reliable for texting, voice notes, video calls, groups, and sharing pics/videos across the world without paying extra. Works flawlessly on slow connections, syncs across devices, and the disappearing messages + status features make staying connected fun and easy. Love it for family chats, quick check-ins with friends abroad, and even some work stuff—simple, fast, no ads in chats.\nBut let’s be real: It’s owned by Meta (Facebook), so there are legit privacy dangers. They collect a ton of metadata (who you talk to, when, how often, your phone number, IP address, device info), and that gets shared within Meta for “improving services” or ads elsewhere. Backups aren’t encrypted by default (turn that on!), business chats can feed into Meta’s ecosystem, and features like Meta AI aren’t fully private. Scams/spam groups pop up too often, and if you’re super privacy-focused, it’s not Signal-level secure.\nStill, for everyday use? It’s one of t  Many of us use WhatsApp for everything including social and work related communication. And all chats and group chats are mixed together. It would be good to be able to add a label to chats according to a category. Then, you could filter the categories and find the ones that are under the label selected easily. This could be useful to save time and also to be able to prioritize messages. 4. Connected to the possibility to label chats to custom categories, it would be useful to put a schedule when you can receive messages in each label. Since most of us use the app as a work tool, but also as our main communication method. This creates a problem when trying to disconnect from work. It would be useful to pin chats (and group chats) to a category and be able to put certain schedule to when you can receive messages from each category of chats. This could help a lot to separate work from social life. This are just ideas that I would love to see through and hope the app continues to improve.","rating":4,"reviewerName":"Ivonne_pg.99","date":"2023-06-14T06:43:29.000Z","dateText":"* null *","dateAuthorText":"* null * · Ivonne_pg.99","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"3","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"10031881920","title":"Potential improvements","contents":"I love the app and it’s my main communication method. I just have some ideas that would make the app experience better. 1. It would be useful to have the possibility to filter (as you can do with unread messages) the group chats and individual chats. This would help to find chats easier. 2. The possibility to schedule messages to be sent at a certain time would be },"id":"10031881920","impressionMetrics":{"fields":{"id":"10031881920","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":1}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"13365264225","title":"My hosnest rewive","contents":"I just wanted to take a moment to express my appreciation for creating such a fantastic app. WhatsApp has truly revolutionized the way we connect with others, and I’m extremely impressed with the range of features it offers. Here are a few aspects that stand out to me: Seamless Communication: The ability to send messages, make voice and video calls, and share multimedia files effortlessly has made WhatsApp indispensable in both my personal and professional life. End-to-End Encryption: The security features, especially end-to-end encryption, give me peace of mind knowing that my private conversations are safe and secure. User-Friendly Interface: I find the app incredibly easy to use, even for someone who’s not particularly tech-savvy. It’s intuitive, and navigating through it feels natural. Cross-Device Syncing: The ability to use WhatsApp on both my phone and desktop, along with WhatsApp Web, makes managing my messages so convenient and accessible, no matter where I am. Group Chats & Status: The group chat feature is perfect for keeping in touch with multiple people, whether it’s family, friends, or colleagues. Plus, I love being able to share status updates with my contacts. No Cost for Calls and Messages: The fact that WhatsApp allows me to communicate globally for free, as long as I have an internet connection, is something I truly value. That said, I’d love to see more features that can enhance our user experience, such as more customization options for notifications and better management tools for large groups. But overall, WhatsApp has exceeded my expectations, and I look forward to its continued growth and improvements. Thank you for such a reliab null *","dateAuthorText":"* null * · huhhhftyff"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"310633997","targetReviewId":"14478556408"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"14478556408","impressionMetrics":{"fields":{"id":"14478556408","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":4}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"12184619408","title":"Filled with scammers, not a secure app","contents":"WhatsApp was what I used when I studied abroad to communicate with friends and family, but I unfortunately the app has so many issues that I refuse to use it even if that means it will be more difficult to communicate with those same friends and family living abroad. The app does provide some privacy in messaging, but based on the updated service agreements, it seems clear that Meta plans to use and train large language models on private messages. Additionally, WhatsApp has a series of issues regarding collecting metadata of its users and having nearly total freedom to monetize that information. I hate the idea of an app that claims to provide private and secure communication that is simultaneously monetizing my data.\n\nThe app is also filled with scammers. I receive near daily notifications from massive cryptocurrency scam groups adding me to group chats promising “massive returns on my investment.” No matter how many times I report these groups, they just keep popping up. I blame the extraction of all contacts from your phone that WhatsApp uses to help you communicate with others through the app. It’s clear that Meta is doing nothing to address these issues and they continue to violate our data while doing nothing.\n\nIf I could go back and never use the app in the first place, I would do it in a heartbeat. There other options for communication with family and friends abroad that does not come with the same issues that WhatsApp promises.","rating":1,"reviewerName":"Bigee14","date":"2025-01-14T20:26:25.000Z","dateText":"* null *","dateAuthorText":"* null * · Bigee14","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"7","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"12184619408","title":"Filled with scammers, not a secure app","contents":"WhatsApp was what I used when I studied abroad to communicate with friends and family, but I unfortunately the app has so many issues that I refuse to use it even if that means it will be more difficult to communicate with those same friends and family living abroad. The app does provide some privacy in messaging, but based on the updated service agreements, it seems clear that Meta plans to use and train large language models on private messages. Additionally, WhatsApp has a series of issues regarding collecting metadata of its users and having nearly total freedom to monetize that information. I hate the idea of an app that claims to provide private and secure communication that is simultaneously monetizing my data.\n\nThe app is also filled with scammers. I receive near daily notifications from massive cryptocurrency scam groups adding me to group chats promising “massive returns on my investment.” No matter how many times I report these groups, they just keep popping up. I blame the extraction of all contacts from your phone that WhatsApp uses to help you communicate with others through the app. It’s clear that Meta is doing nothing to address these issues and they continue to violate our data while doing nothing.\n\nIf I could go back and never use the app in the first place, I would do it in a heartbeat. There other options for communication with family and friends abroad that does not come with the same issues that WhatsApp promises.","rating":1,"reviewerName":"Bigee14","date":"2025-01-14T20:26:25.000Z","dateText":"* null *","dateAuthorText":"* null * · Bigee14"}],"url":null,"mergeWhenFetched":false,"fetchStrategy":"onPageLoad","batchGroup":null,"seeAllAction":null,"footerTitle":null,"footerAction":null,"eyebrow":null,"eyebrowArtwork":null,"footerStyle":null,"titleArtwork":null,"subtitle":null,"isHorizontal":false,"isHidden":false,"rowsPerColumn":null,"itemCount":{"type":"all"},"background":{"type":"none"},"contentsMetadata":{"type":"none"},"overrideLayoutConfigurations":[],"isPersonalized":false,"shouldFilterApps":false}],"presentationOptions":[],"isIncomplete":false,"pageMetrics":{"$kind":"PageMetrics","instructions":[],"custom":{}},"$kind":"ReviewsPage","adamId":"310633997","targetReviewId":"12184619408"},"presentationContext":"infer","animationBehavior":"infer","origin":"inapp"}},"id":"12184619408","impressionMetrics":{"fields":{"id":"12184619408","name":"","impressionType":"helpfulReview","idType":"its_id","impressionIndex":5}}},{"$kind":"ProductReview","componentType":"productReview","sourceType":"user","review":{"$kind":"Review","id":"10384277855","title":"The worst move yet","contents":"Whats app has been the most reliable and best app for as long as touch screens phone have existed. I lived in many countries. Some people even prefer to only have whats app on their phone. Now whats app has media, and channels and it gets connected with facebook ???? No one asked for that. I understand that instagram is getting replaced with TikTok. And threads didn’t do as needed. But now turning whats app into instagram is by far the dumbest move. Telegram will definitely be winning people now. Whats does connecting my whats app account with facebook do to my end-to-end encryption. Whats app is everyone’s number one choice simply cause its simple. A lot of old people and a lot of disabled people even children. Work,teams,companies, organizations use whats app and whats app groups for a simple use. And in countries in  Africa, asia, south America… where internet is much slower. Whats app is easy to use as it only uses data for sending and receiving messages. Now it needs data to upload media and what not. \nThere has been a lot of upgrades, that are nice and helpful, but going to the status section is just overwhelming. Having a second related app, like messenger is to facebook would have been a much better idea. It could be a media based application with a totally new way to view and share that media through whats app chat which can be the normal app. I feel like meta is panicking, all these risky changes are extremely overwhelming. And eventually we’ll witness nokia all over again.","rating":1,"reviewerName":"kingozsmann","date":"2023-09-19T11:40:57.000Z","dateText":"* null *","dateAuthorText":"* null * · kingozsmann","moreAction":{"title":"Ratings & Reviews","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[],"custom":{}},"$kind":"flowAction","actionClass":"FlowAction","page":"reviews","pageData":{"shelves":[{"$kind":"Shelf","impressionMetrics":{"fields":{"id":"8","name":"","impressionType":"ratingsDetails","idType":"sequential","impressionIndex":0}},"contentType":"reviews","marker":null,"items":[{"$kind":"Review","id":"10384277855","title":"The worst move yet","c nd too soon? You can edit the message up to 15 minutes after sending\n\nDISAPPEARING MESSAGES\nSome things aren’t meant to last forever. Choose how long your end-to-end encrypted chats stick around after they’ve been read.\n\nCOME TOGETHER WITH YOUR COMMUNITIES\nMeaningfully connect with people like you from your school, neighborhood, and interest groups.\n\nGET IN YOUR FAVORITE CREATORS’ INNER CIRCLE\nStay in the know with creators by joining their broadcast channels for authentic and casual content.\n\nUNLEASH YOUR IMAGINATION W/ META AI*\nTap into your go-to creative partner to create, edit, animate images and more.\n\nCAPTURE EVERYDAY MOMENTS ON STORIES\nHighlight moments of your day using photos and videos that disappear after 24 hours in Stories.\n\nDROP A NOTE WITH YOUR THOUGHTS\nStay connected with your friends by sharing quick updates that disappear after 24 hours.\n\nBRING YOUR VIBE TO YOUR CHATS\nSometimes words just don’t cut it. Tap into more ways to express yourself with animated stickers, GIFs, reactions and more.\n\nSET THE MOOD OF YOUR CHAT WITH THEMES\nCustomize your chat with a large and constantly evolving list of themes featuring popular artists, holidays, and more. \n\n*Meta AI is available in select languages and countries only, with more coming soon.\n","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=454638411&pricingParameters=STDQ&pg=default&appExtVrsId=893145122"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"454638411"},{"locationPosition":0,"locationType":"lockup","name":"Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"454638411"},{"locationPosition":12,"locationType":"si eloperTagline":"Fast. Secure. Powerful.","editorialTagline":"Enjoy Premium features","ageRating":"13+","productDescription":"Pure instant messaging — simple, fast, secure, and synced across all your devices. One of the top 5 most downloaded apps in the world with over 1 billion active users.\n\nFAST: Telegram is the fastest messaging app on the market, connecting people via a unique, distributed network of data centers around the globe.\n\nSYNCED: You can access your messages from all your phones, tablets and computers at once. Telegram apps are standalone, so you don’t need to keep your phone connected. Start typing on one device and finish the message from another. Never lose your data again.\n\nUNLIMITED: You can send media and files, without any limits on their type and size. Your entire chat history will require no disk space on your device, and will be securely stored in the Telegram cloud for as long as you need it. \n\nSECURE: We made it our mission to provide the best security combined with ease of use. Everything on Telegram, including chats, groups, media, etc. is encrypted using a combination of 256-bit symmetric AES encryption, 2048-bit RSA encryption, and Diffie–Hellman secure key exchange. \n\n100% FREE & OPEN: Telegram has a fully documented and free API for developers, open source apps and verifiable builds to prove the app you download is built from the exact same source code that is published. \n\nPOWERFUL: You can create group chats with up to 200,000 members, share large videos, documents of any type (.DOCX, .MP3, .ZIP, etc.) up to 2 GB each, and even set up bots for specific tasks. Telegram is the perfect tool for hosting online communities and coordinating teamwork.\n\nRELIABLE: Built to deliver your messages using as little data as possible, Telegram is the most reliable messaging system ever made. It works even on the weakest mobile connections. \n\nFUN: Telegram has powerful photo and video editing tools, animated stickers and emoji, fully customizable themes to change the appearance of your app, and an open sticker/GIF platform to cater to all your expressive needs.\n\nSIMPLE: While providing an unprecedented array of features, we take great care to keep the interface clean. Telegram is so simple you already know how to use it.\n\nPRIVATE: We take your privacy seriously and will never give any third parties access to your data. You can delete any message you ever sent or received for both sides, at any time and without a trace. Telegram will never use your data to show you ads.\n\nFor those interested in maximum privacy, Telegram offers Secret Chats. Secret Chat messages can be programmed to self-destruct automatically from both participating devices. This way you can send all types of disappearing content — messages, photos, videos, and even files. Secret Chats use End-to-End Encryption to ensure that a message can only be read by its intended recipient.\n\nWe keep expanding the boundaries of what you can do with a messaging app. Don’t wait years for older messengers to catch up with Telegram — join the revolution today.\n\nTerms of Use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=686449807&pricingParameters=STDQ&pg=default&appExtVrsId=893667382"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"686449807"},{"locationPosition":1,"locationType":"lockup","name":"Telegram Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"686449807"},{"locationPosition":12,"locationType":"similarItems","name":"You Might Also Like","idType":"relationship","id":"customers-also-bought-apps"}] ription":"Rakuten Viber is a secure, fun, and exciting messaging and calling app, connecting over a billion people worldwide!\n\nYou can do it all with Rakuten Viber: group chats, disappearing messages, reminders, and more:\n\nSend messages for free\nStaying in touch has never been easier. Send a free text, photo, sticker, GIF, voice or video message, along with many other types of files.\n\nMake free audio and video calls\nEnjoy unlimited Viber-to-Viber calls to anyone in the world for free. You can even call up to 60 people at the same time! Great for connecting with friends, family, and colleagues :)\n\nExperience end-to-end encryption\nOn by default for all 1-on-1 calls, chats, and group chats, end-to-end encryption allows to you to communicate with confidence knowing that all messages will remain private. No one, not even Rakuten Viber, can read your messages.\n\nMake low-cost calls to landlines with Viber Out\nCall any landline or mobile phone with Viber Out’s low-cost international calling service. Get a Viber Out subscription to call a specific destination or keep your options open and buy minutes to call anywhere in the world. \n\nOpen a group chat\nCatch up with friends, family, and colleagues by opening a group chat for up to 250 members. Use polls and quizzes, @mentions and reactions to get the most out of your group!\n\nExpress yourself with lenses, GIFs, and stickers\nPersonalize your chats! Get creative with fun, funny, and beautifying Viber lenses. GIFs and over 55,000 stickers also await you - you can even create your own.\n\nUse disappearing messages\nSend disappearing messages in your 1-on-1 and group chats by setting a timer for each message. You can choose how long the message will be available after it’s opened - 10 seconds, 1 minute, or up to 1 day!\n\nConnect in Communities and Channels\nWhether it's sports, news, cooking, travel or entertainment, get the content you really want and connect with others with similar interests. You can even start your own Community or Channel and gain a global following. \n\nChat with AI bots\nRakuten Viber's AI bots will answer all your questions and turn your words into beautiful art. You can also find verified bots to get the latest news on fashion, book your travel, and even pay your electricity bills!\n\nReact to messages\nReact to messages with emojis to express exactly how you feel in chats!\n\nCreate notes and reminders\nForward interesting messages, keep meaningful links, and add your thoughts to your notes. You can also set reminders to ensure you never forget important tasks and events. \n\nRakuten Viber is part of the Rakuten Group, a world leader in e-commerce and financial services. \n\nTerms & Policies: https://www.viber.com/terms/","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=382617920&pricingParameters=STDQ&pg=default&appExtVrsId=893668140"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"382617920"},{"locationPosition":2,"locationType":"lockup","name":"Rakuten Viber Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"382617920"},{"locationPosition":12,"locationType":"similarItems","name":"You Might Also Like","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"382617920","eventType":"click","targetType":"button","targetId":"382617920","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"jet_adamId":"382617920"}},"$kind":"OfferAction","actionClass":"OfferAction","adamId":"382617920","purchaseConfig d and grouped by time\n4- Status Maker/Editor: the ability to create awesome statuses\n5- Status Library: updated server-side library where users can find and use awesome statuses (can be used with Status Maker)\n6- Stickers Maker: the ability to make sticker packs and import them directly to Whatsapp (images can be captured from the camera or imported from the iPhone photo library)\n7- Stickers Library: updated server-side library where users can find and use awesome stickers (can be used with Stickers Library)\n8- Contact Import for WhatsApp: ability to import WhatsApp contacts from any WhatsApp account into the iPhone Address Book\n9- Quick Chat: ability to open WhatsApp chat-box with someone not in your contact just by entering their phone number\n10- Contact Merge: ability to detect and merge duplicate/similar contacts in the iPhone Address Book\n\nMajor Revamp & New Features update now!\n- Connectivity issue is now fixed ( We are really Sorry from the users who faced connectivity issues we read your reviews and acted :) )\n- A whole new Look & Feel and enhanced user Experience\n- New Tools: Stickers Maker For WhatsApp, Stickers Library For WhatsApp , Status Library For WhatsApp, In App customer support section where you can talk to us and we can help you with any issue you might face and answer all your questions. Premium member will have faster respond time.\n- Super New Tool: Status StoryLine History of all statuses, sync them on iCloud or on Our servers, reopen them from any iOS device and restore them, view them by date nicely sorted on a calendar View\n- Many more for you to discover\n\nKey Features:\n1- WhatsApp Status Saver + Widget\n2- Import WhatsApp contact from any WhatsApp to your iPhone Address Book.\n3- Synchronize your iPhone contacts photos with your friends recent WhatsApp profile pics.\n4- Open a WhatsApp chat box with someone not in your contact by entering their phone number.\n5- Merge Duplicate/Similar Contacts.\n\nWe are listening, contac connections. \n\nFUN: Telegram has powerful photo and video editing tools, animated stickers and emoji, fully customizable themes to change the appearance of your app, and an open sticker/GIF platform to cater to all your expressive needs.\n\nSIMPLE: While providing an unprecedented array of features, we take great care to keep the interface clean. Telegram is so simple you already know how to use it.\n\nPRIVATE: We take your privacy seriously and will never give any third parties access to your data. You can delete any message you ever sent or received for both sides, at any time and without a trace. Telegram will never use your data to show you ads.\n\nFor those interested in maximum privacy, Telegram offers Secret Chats. Secret Chat messages can be programmed to self-destruct automatically from both participating devices. This way you can send all types of disappearing content — messages, photos, videos, and even files. Secret Chats use End-to-End Encryption to ensure that a message can only be read by its intended recipient.\n\nWe keep expanding the boundaries of what you can do with a messaging app. Don’t wait years for older messengers to catch up with Telegram — join the revolution today.\n\nTerms of Use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=686449807&pricingParameters=STDQ&pg=default&appExtVrsId=893667382"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"686449807"},{"locationPosition":1,"locationType":"lockup","name":"Telegram Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"686449807"},{"locationPosition":13,"locatio ":null,"tertiaryTitleArtwork":null,"developerTagline":"Message with Confidence","ageRating":"13+","productDescription":"Rakuten Viber is a secure, fun, and exciting messaging and calling app, connecting over a billion people worldwide!\n\nYou can do it all with Rakuten Viber: group chats, disappearing messages, reminders, and more:\n\nSend messages for free\nStaying in touch has never been easier. Send a free text, photo, sticker, GIF, voice or video message, along with many other types of files.\n\nMake free audio and video calls\nEnjoy unlimited Viber-to-Viber calls to anyone in the world for free. You can even call up to 60 people at the same time! Great for connecting with friends, family, and colleagues :)\n\nExperience end-to-end encryption\nOn by default for all 1-on-1 calls, chats, and group chats, end-to-end encryption allows to you to communicate with confidence knowing that all messages will remain private. No one, not even Rakuten Viber, can read your messages.\n\nMake low-cost calls to landlines with Viber Out\nCall any landline or mobile phone with Viber Out’s low-cost international calling service. Get a Viber Out subscription to call a specific destination or keep your options open and buy minutes to call anywhere in the world. \n\nOpen a group chat\nCatch up with friends, family, and colleagues by opening a group chat for up to 250 members. Use polls and quizzes, @mentions and reactions to get the most out of your group!\n\nExpress yourself with lenses, GIFs, and stickers\nPersonalize your chats! Get creative with fun, funny, and beautifying Viber lenses. GIFs and over 55,000 stickers also await you - you can even create your own.\n\nUse disappearing messages\nSend disappearing messages in your 1-on-1 and group chats by setting a timer for each message. You can choose how long the message will be available after it’s opened - 10 seconds, 1 minute, or up to 1 day!\n\nConnect in Communities and Channels\nWhether it's sports, news, cooking, travel or entertainment, get the content you really want and connect with others with similar interests. You can even start your own Community or Channel and gain a global following. \n\nChat with AI bots\nRakuten Viber's AI bots will answer all your questions and turn your words into beautiful art. You can also find verified bots to get the latest news on fashion, book your travel, and even pay your electricity bills!\n\nReact to messages\nReact to messages with emojis to express exactly how you feel in chats!\n\nCreate notes and reminders\nForward interesting messages, keep meaningful links, and add your thoughts to your notes. You can also set reminders to ensure you never forget important tasks and events. \n\nRakuten Viber is part of the Rakuten Group, a world leader in e-commerce and financial services. \n\nTerms & Policies: https://www.viber.com/terms/","buttonAction":{"title":"Get","presentationStyle":[],"actionMetrics":{"$kind":"ActionMetrics","data":[{"shouldFlush":false,"fields":{"reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","actionDetails":{"buyParams":"productType=C&price=0&salableAdamId=382617920&pricingParameters=STDQ&pg=default&appExtVrsId=893668140"},"location":[{"locationPosition":0,"locationType":"button","name":"Get","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"382617920"},{"locationPosition":2,"locationType":"lockup","name":"Rakuten Viber Messenger","reco_algoId":"cab_1","reco_eligible":"1","reco_hash":"cab_1","idType":"its_id","id":"382617920"},{"locationPosition":13,"locationType":"similarItems","name":"You Might Also Like","idType":"relationship","id":"customers-also-bought-apps"}],"jet_adamId":"382617920","eventType":"click","targetType":"button","targetId":"382617920","platformContext":"iphone","alt_ab2_data":"[]"},"includingFields":["impressionsSnapshot","pageFields","contentRestrictionReasons","appState"],"excludingFields":["amsMetricsID"],"topic":"xp_amp_appstore_unidentified"}],"custom":{"je nd meetings","ageRating":"4+","productDescription":"Google Meet is a high-quality video calling app designed to help you have meaningful and fun interactions with your friends, family, colleagues, and classmates, wherever they are.\n\nMeet lets you connect in whatever way works for you: Call someone spontaneously, schedule time together, or send a video message that they can watch and respond to later.\n\nMeet also helps you get things done. It integrates with other Google Workspace apps like Gmail, Docs, Slides, and Calendar, and offers a number of features to help you run smooth and engaging meetings, like noise cancellation, in-call chat, recordings, and more.*\n\nFeatures to look forward to:\n\nMake spontaneous calls or host video meetings with your friends and colleagues, all in one app.\n\n\nEnjoy one-on-one video calls for up to 24 hours and host meetings for up to 60 minutes and 100 people at no cost.\n\n\nFollow along in your preferred language with real-time translated captions in over 70 languages.\n\n\nUse in-call chat to share ideas, ask questions, or provide feedback without interrupting the flow of the conversation.\n\n\nMake your calls more engaging with in-call emojis that allow you to express yourself seamlessly without interrupting the conversation.\n\n\nShare visuals like photos, videos, and presentations during your call to collaborate or simply share memories from your recent vacation.\n\n\nMake your calls with family and friends more fun with stackable effects that allow participants to add multiple backgrounds, filters, and animations, to create a personalized experience.\n\n\nUse on-the-go mode for an audio-only experience with larger call controls, making it easier to take calls with fewer distractions while walking, driving, or using public transportation.\n\n\nAccess on any device: Meet works across mobile, tablet, web, and smart devices,** so everyone can join.\n\nHigh quality video: Show up looking your best with up to 4k video quality
