l,null,"https://www.zynga.com/"]],["android.support@zynga.com"],null,null,["Zynga Inc.",["support@zynga.com"],["1200 Park Pl Ste 100\nSan Mateo, CA 94403\nUnited States"],"+1 650-487-0989"]],null,null,[[null,"CSR2 is a real driving simulator that delivers hyper-real drag racing to the palm of your hand. In its 3rd iteration after CSR Racing and CSR Classics; CSR Racing 2 is a great mobile drag race game experience. With millions of players to date and extensive partnerships with the world’s leading car manufacturers, this real car racing game is a fantastic driving simulator for motorized vehicles fans. \u003cbr\u003e\u003cbr\u003eCompete with players across the world in your custom built cars including Ferrari SF90 Stradale, McLaren Senna, Bugatti La Voiture Noire and more. Race opponents in real-time driving games challenges. Team up with friends to form a crew and tune your rides for maximum speed!  Free car games don’t get more real than this! Join the club and download an awesome free cars game and get racing now\u003cbr\u003e\u003cbr\u003eShow off car racing games and car play automobiles in your huge warehouse garage – CSR 2 features officially licensed vehicles, including Porsche, Aston Martin, Lamborghini, Pagani Koenigsegg, Toyota Supra Aerotop, Nissan Skyline GT-R (R34 NISMO S-tune), Chevrolet Camaro ZL1 1LE NASCAR or Mercedes-AMG F1 W11 EQ Performance #44\u003cbr\u003e\u003cbr\u003eCAMPAIGN MODES - ELITE TUNERS AND LEGENDS\u003cbr\u003eCross the finish line in a single-player drag race across stunning race courses. Go cruising and work your way from Junior Dragster to Top Fuel by beating top street racing crews in the city\u003cbr\u003e\u003cbr\u003eTake racing car games to the next level with “Elite Tuners”. Thousands of car driving simulator and car customization options available: from engine, tires, rims, traction, clutch, full-body wraps, and more. Add underground cars and motorcycles games favorites such as the Toyota GR Supra or Nissan GT-R (R35) or the McLaren F1 in “Legends”\u003cbr\u003eHit the asphalt in a speed race against opponents, or rally to the road in a drag race against your friends. Feel the real racing experience as you burst from your staging beams, and burnout down the lane in courses from North America or Europe in drag racing games! Beat traffic in these fuel dragsters across short distances in motor sport racing games\u003cbr\u003e\u003cbr\u003e• Car Customize: In CSR2, Collect some of the most iconic autos from the 60s, 70s, 80s and yes, the 90s! Customize your ride to find the car you need to climb the hill for your best racing experience. Go racing post midnight in this free driving game \u003cbr\u003e• BEST CAR GAMES: Upgrade this free car game by restoring your rides to their former glory in the Legends workshop as you go for speed\u003cbr\u003e• Use classic cars to take down an intense single player campaign\u003cbr\u003e• CITY CAR DRIVING: Tear up the road, mile after km, with fast, contemporary cars in free racing games for boys or girls\u003cbr\u003e• Get the real car drift games experience with AR mode. In these free games, experience what it\u0026#39;s like to sit in one of these motor racing cars\u003cbr\u003e•Furious Drifting: Master oversteering, opposite lock, oversteers and countersteering to become a drifting games, parking games, and car parking expert\u003cbr\u003e•Tune Cars: Customize your hot wheels, bring them to the track in a contestants race and prove who is the best sports car driver around in free car games\u003cbr\u003e•There is no limit to your 3d tuning of these epic cars; with a wide range of paint, nitro, wheels, brake calipers and turbo options; you can make a fearsome rebel drift racing car, or a funny car\u003cbr\u003e•Get in the road driving  race faster than other online car games\u003cbr\u003e•No Wifi Games: Play these offline car games to master 9 second cars wherever you go\u003cbr\u003e\u003cbr\u003eMust be 13+ to play this car game. \u003cbr\u003e scuing exotic creatures at the Animal Park\u003cbr\u003e● Pairing wine and cheese at the Tasting Table\u003cbr\u003e● Racing with fellow farmers at the Boat Club\u003cbr\u003e● Visiting the County Fair with your best bakes\u003cbr\u003e● Uncovering a new ecosystem of aquatic animals and crops\u003cbr\u003e● Mastering your farm\u0026#39;s finest goods to earn worldwide prestige\u003cbr\u003e● Collecting daily prizes at the Prospector\u0026#39;s Corner and Prize Wheel\u003cbr\u003e● And so much more!\u003cbr\u003e\u003cbr\u003e🌾 Build your dream Farm:\u003cbr\u003e● Plant new crops, water them \u0026amp; harvest them to grow your farm\u003cbr\u003e● Utilize workshops like Windmill, Pastry Oven, Dairy, Stovetop to enhance your farm\u003cbr\u003e● Use crops \u0026amp; workshops to make items like Country Biscuits, Cheese, Yogurt and so much more!\u003cbr\u003e\u003cbr\u003e🐄 Nurture Farm Animals:\u003cbr\u003e● What is a farm without animals!\u003cbr\u003e● Cows, Chickens, Goats, Horses \u0026amp; more animals are ready to join your farm\u003cbr\u003e● Special pets like Rescue Tabby waiting to join you \u0026amp; help you gather exotic ingredients to cook up interesting items on the farm\u003cbr\u003e\u003cbr\u003e🗺️ Go on Farm Adventures:\u003cbr\u003e● Pappy’s Pond: Use your Farmhands at Pappy\u0026#39;s Pond to find Trout, Bass, \u0026amp; Mint!\u003cbr\u003e● Sophia’s Tasting Table: Sophia will buy fine wine, cheeses, \u0026amp; other high-end goods from your farm\u003cbr\u003e● Merryweather Mine: Excavate the mine and get exotic minerals like quartz, copper \u0026amp; tin!\u003cbr\u003e\u003cbr\u003e🤝 Farm and Play with Friends:\u003cbr\u003e● Join coops \u0026amp; invite friends to play together\u003cbr\u003e● Help others by trading items from your barn\u003cbr\u003e● Compete with friends and neighbors in friendly races to win rewards\u003cbr\u003e\u003cbr\u003eEscape to your dream farm and enjoy one of the most relaxing games offline!\u003cbr\u003eIt\u0026#39;s c aft artisan goods, and fulfill orders to expand their farm from a small homestead into a thriving village with relaxing gameplay and long-term daily progression.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eFEATURES OF FARMVILLE 3\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003e🐣 Animal Collection and Breeding\u003c/b\u003e\u003cbr\u003e\u003cbr\u003eThe heart of FarmVille 3 is its animal collection system. Players unlock, raise, and breed hundreds of animals across dozens of species,  from classic farm animals like chickens, cows, pigs, and horses to exotic and specialty breeds like penguins, alpacas, and rare hybrids.\u003cbr\u003e\u003cbr\u003e• Breed animals to discover new, rare species\u003cbr\u003e• Each animal produces unique farm goods\u003cbr\u003e• Rare breeds yield premium resources that unlock advanced crafting recipes and progression\u003cbr\u003e• Complete mini-games and special events to rescue and unlock exotic animals\u003cbr\u003e• Build and upgrade animal habitats tailored to each species\u003cbr\u003e• Raise baby animals by feeding them and completing nurturing quests\u003cbr\u003e\u003cbr\u003e\u003cb\u003e🏡 Farm Decoration and Building\u003c/b\u003e  Design Your Dream Farm\u003cbr\u003e\u003cbr\u003eFull creative control over how their farm looks and grows:\u003cbr\u003e\u003cbr\u003e• Design and decorate your farm with hundreds of unique buildings, structures, and ornamental items\u003cbr\u003e• Choose from multiple building styles, skins, and seasonal themes\u003cbr\u003e• Customize farmhands and pets with outfits and accessories\u003cbr\u003e• Expand your land by unlocking new zones, from the garden to the forest and beyond\u003cbr\u003e• Renovate and upgrade animal habitats, crafting buildings, and community structures\u003cbr\u003e• Use weather mechanics to optimize harvest timing for crops like hay, wheat, and specialty produce\u003cbr\u003e• Transform a small plot into a fully personalized village, the layout, style, and pace are entirely up to you\u003cbr\u003e\u003cbr\u003e\u003cb\u003eCrafting and Fulfilling Orders\u003c/b\u003e  \u003cbr\u003e\u003cbr\u003e• Craft artisan goods:  cook recipes, bake bread, press oil, produce dairy, brew beverages, and more\u003cbr\u003e• Fulfill sale orders from villagers and traders to earn coins, experience, and expansion materials\u003cbr\u003e• Work with local artisans including blacksmiths, cooks, and park rangers to unlock new crafting chains\u003cbr\u003e• Build a team of specialized Farmhands (lumberjacks, bakers, brewers) and level them up to unlock new skills and recipes\u003cbr\u003e• Trade resources with neighbors or sell goods in your farm\u0026#39;s market\u003cbr\u003e• Complete daily quests, seasonal events, and co-op challenges\u003cbr\u003e\u003cbr\u003e\u003cb\u003e👩\u200d🌾👨\u200d🌾Social and Multiplayer Features\u003c/b\u003e  \u003cbr\u003e\u003cbr\u003e• Play with friends or discover new ones through co-op farming\u003cbr\u003e• Join a Co-Op to tackle community goals and unlock exclusive animals and items\u003cbr\u003e• Visit other farms, chat, and help neighbors with tasks\u003cbr\u003e• Compete in seasonal races and leaderboard events\u003cbr\u003e\u003cbr\u003eUse of this application is governed by the Zynga Terms of Service. These Terms are available through the License Agreement field below, and at https://www.take2games.com/legal.\u003cbr\u003e\u003cbr\u003eFor specific information about how Zynga collects and uses personal or other data, please read our privacy policy at https://www.take2games.com/privacy. Zynga’s Privacy Policy is also available through the Privacy Policy field below.\u003cbr\u003e\u003cbr\u003eThe game is FREE to download and includes optional in-game purchases (including random items). Information about drop rates for random item purchases can be found in-game. If you wish to disable in-game purchases, please turn off the in-app purchases in your phone or tablet’s Settings.\u003cbr\u003e\u003cbr\u003eThis game do  a hole-in-one and prove you\u0026#39;re a golf pro!\u003cbr\u003e\u003cbr\u003eWe’re adding a new layer of depth in Golf Rival! With focus on golf clubs players already love, and a new fun world to prove them in! With Course Conditions in play, every hole feels unique. Wind zones and gravity shifts force you to read the course fresh, every single time. And Club Mods help in countering whatever the golf course throws at you. Players dust off clubs they already own, slot in new mod upgrades, and tune their golf clubs to personalized strategies.\u003cbr\u003e\u003cbr\u003eThis exciting free golf game has many modes to play and master. From 1v1 golf shootout duels, to golf championship Tournaments against a global community of golfers, to playing golf with rivals and friends. In Golf Rival, scoring a birdie is only the start of the competitive fun! Outwit rivals with powerful golf balls and clubs, because no two online golf matches are ever the same.\u003cbr\u003eGrab your clubs, and enjoy the golfing fun, whether you\u0026#39;re a golfing newbie or an ultimate sports game expert!\u003cbr\u003e\u003cbr\u003ePLAY EXCITING GOLF GAMES\u003cbr\u003e-Unlock incredible golf challenges and conquer them by winning real time golf clashes and shootouts\u003cbr\u003e-Master your golf swing with precision and creativity and watch your skills grow\u003cbr\u003e-Compete in both 9-hole and 18-hole golf championship Tournaments every exciting season\u003cbr\u003e-Multiplayer golf mode and daily challenges await - play golf now every single day!\u003cbr\u003e-Beautiful 3D golf courses across different themes and difficulties always deliver an ultimate golf challenge\u003cbr\u003e\u003cbr\u003eGROW YOUR GOLF SKILLS\u003cbr\u003e-Golf Rival is unlike any free golf game you\u0026#39;ve tried - a true golfing simulator with creative and fantastical clubs and balls\u003cbr\u003e-Win real golf duels to unlock amazing rewards for your golf bag and take your golf pro skills to the next level\u ll by beating levels and unlocking spells to conquer difficult Match 3 puzzles.\u003cbr\u003e\u003cbr\u003eProgress in your Harry Potter: Puzzles \u0026amp; Spells Match 3 saga, relive classic wizarding world characters and moments from the films, including Harry, Ron and Hermione toppling trolls, Fred \u0026amp; George playing pranks, and Hagrid taking care of Magical Creatures at Hogwarts! The wonders of the Wizarding World await as you collect magical creatures to aid in this free Match 3 game! Get ready to ‘swish and flick’ your way to a puzzles journey of your very own in this matching game filled with innovative Match 3 puzzle play that even adept Match-3 puzzles experts will love! Merge gems to develop your magic skills in this game that blends strategy, Harry Potter nostalgia and community.\u003cbr\u003e\u003cbr\u003eo Fun Daily Events: It\u0026#39;s more than a Match 3 puzzle game - experience different events everyday! Play the Monthly Calendar filled with mini games, like Find the Hidden Object\u003cbr\u003e\u003cbr\u003eo Unlock \u0026amp; Upgrade Spells: Use magical spells to obliterate puzzle obstacles and blast hazards like Chocolate Frogs and Potions to dominate Match 3 challenges. Earn experience points as you complete puzzles to level up your abilities to crush fantastical Match-3 puzzle games.\u003cbr\u003e\u003cbr\u003eo Celebrate the Magic of Harry Potter: Solve Match-3 games while reliving memorable scenes and sounds from the Harry Potter stories in this strategy game filled with your favourite wizarding world moments. Along the way, the Daily Prophet will keep you up-to-date with Harry\u0026#39;s epic journey\u003cbr\u003e\u003cbr\u003eo Win Rewards: Get rewarded for match 3 puzzle solving! Unlock event chests with power-ups, gold and more to help you with your puzzle mastery in these fun free games.\u003cbr\u003e\u003cbr\u003eo Play In Clubs: Awaken your competitive match 3 side and climb the leaderboard to victory. Work together with your Club to dominate rivals in tournaments and challenges, like Battle of Hogwarts, to defeat dark foes like Bellatrix, Nagini and more!\u003cbr\u003e\u003cbr\u003eo Events Galore: There\u0026#39;s something different to play everyday. You’ll never get bored with Duelling, Broom Race and more awesome Match-3 games! These free match 3 games have different challenges, so explore the Hedge Maze, keep your matching games win streak going, upgrade spells and go head-to-head with other players.\u003cbr\u003e\u003cbr\u003eo Unlock Magical Creatures: Build a marvelous collection of rare creatures as you advance through free Match-3 gameplay. Each creature delivers unique benefits to enhance your puzzle-solving power. Beat these puzzles for free to build your collection and solve challenging Match-3 puzzles in these fun free games.\u003cbr\u003e\u003cbr\u003eo Customize Your Avatar: Join your favourite Hogwarts house, choose your wand and customize your avatar with unique hairstyles and accessories to stand out through magical match 3 Harry Potter moments!\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eADDITIONAL DISCLOSURES\u003cbr\u003eFor specific information about how Zynga collects and uses personal or other data, please read our privacy policy at https://www.zynga.com/privacy/policy. Use of this application is governed by the Zynga Terms of Service, found at https://www.zynga.com/legal/terms-of-service. The game is free to play, however in-app purchases are available for additional content and premium currency.\u003cbr\u003e\u003cbr\u003eHarry Potter: Puzzles \u0026amp; Spells game is FREE to download and includes optional in-game purchases (including random items). Information about drop rates for random item purchases can be found in-game. If you wish to disable in-game purchases, please turn off the in-app purchases in your phone or tablet’s Settings.\u003cbr\u003e\u003cbr\u003eHARRY POTTER: PUZZLES \u0026amp; SPELLS TM \u0026amp; © Warner Bros. Entertainment Inc. Software code d"],[[[null,null,"aEOPtw3YWws",[null,null,"https://play.google.com/video/lava/web/player/yt:movie:aEOPtw3YWws?autoplay\u003d1\u0026embed\u003dplay"],"yt:movie:aEOPtw3YWws",null,null,null,null,"AXH1ezm9GpHer0GfSUGnBfLGIsMvROHuOHzecg21q4xoWl3UJ-NLryb_LSrJ8Xcum-B98fDisq_gQEgsbBevrXlgzrGc5N_cQowkQTbgttgoE88KwIYmY487IZL8qaf_i04KNsxZskoPCwjAE2_wu1oSErtl-wqDtZHxv9lzKULB5tphffHsPCfj799UzXOkp2AjY4QagULkcs45amVgquz3MBp-fhoFy9sZlPIz_uNiIHho2w-V7bz7uBPfSwQClAbPnl5pePyO-QcUZ0J_E98uZvBkupGjOnoyNFMSUtjkslR8stUZLrb2zJs7_PLpzfWCfXO5bUR3oV_S"],null,1,[null,null,null,[null,null,"https://i.ytimg.com/vi/aEOPtw3YWws/hqdefault.jpg"]]]],[null,"Drift Max Pro Car Racing Game is the ultimate drift racing simulator that turns every driver into a champion. Feel the excitement of pure racing, the control of a realistic car simulator, and the thrill of multiplayer competition where every race matters. Build your dream car, tune it for power and precision, and drift your way to victory.\u003cbr\u003e\u003cbr\u003eStep into your car and experience the next level of racing realism. Each race combines precision handling, responsive physics, and deep control that only a true simulator can offer. Every driver feels the road, the weight, and the movement of a perfectly balanced car. The sensation of speed, smoke, and sliding through corners defines what real racing feels like.\u003cbr\u003e\u003cbr\u003eCreate and customize your ultimate car. Upgrade engines, suspension, brakes, and tires to fine-tune every element. Adjust the gearbox, add turbos, change rims, and select body kits to make your car unique. Every tune transforms how your car drifts, accelerates, and handles on each track. Feel the pride of a driver who builds machines built to win.\u003cbr\u003e\u003cbr\u003eExperience the heart of a true drift simulator with stunning graphics, realistic sound, and deep immersion. Each track is designed for performance — from neon-lit city streets to airport runways and mountain passes. Every race feels alive with tire smoke, reflections, and roaring engines. The simulator brings every detail to life, making you believe you’re behind the wheel of a real racing car.\u003cbr\u003e\u003cbr\u003eTake the competition online in thrilling multiplayer battles. Race against real drivers from around the world, show your best drifts, and prove who has the ultimate tune. Each multiplayer session tests skill, speed, and consistency. Dominate leaderboards, earn rewards, and rise through the ranks as the driver everyone wants to beat. Whether it’s friendly competition or global challenge, every race counts.\u003cbr\u003e\u003cbr\u003ePlay offline to master your lines, then go online to challenge others. Practice, race, and tune without limits. The simulator rewards dedication — every car you master, every corner you drift, and every lap you finish brings you closer to perfection. Feel the improvement with every race as your car becomes faster and your confidence as a driver grows.\u003cbr\u003e\u003cbr\u003eEach drift is a dance between balance and bravery. You feel the rear slide, counter-steer to catch it, and accelerate through smoke while holding perfect control. That’s the soul of Drift Max Pro — a simulator where skill matters more than luck. Race after race, your reflexes sharpen and your car becomes an extension of you. The deeper you tune, the better the drift.\u003cbr\u003e\u003cbr\u003eEarn prizes, unlock rare parts, and expand your garage with cars designed for ultimate racing. Build your collection, from street legends to high-performance monsters. Each car can be tuned endlessly to fit your drifting style. Combine power, grip, and technique to dominate every race. The more you drive, the more the simulator rewards you.\u003cbr\u003e\u003cbr\u003eJoin a vibrant multiplayer community of racers and drifters. Compete in time-limited events, climb leaderboards, and share your tuned creations. Every driver adds to a living world of racing passion. Updates bring new cars, parts, and events, keeping the simulator fresh and challenging. There’s always another race to win, another rival to defeat.\u003cbr\u003e\u003cbr\u003eDrift Max Pro Car Racing Game captures what every driver loves — the sound of the engine, the art of tuning, and the rush of speed in the perfect race. It’s more than a game; it’s a complete racing simulator that celebrates drift, power, and control. Build your car, tune your setup, enter multiplayer events, and drive your way to glory.\u003cbr\u003e\u003cbr\u003eStart your engine, feel the power, and rule the track in Drift Max Pro Car Racing Game — the drift simulator where every car, every race, and every driver becomes legendary."],"Tiramisu","100,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/XsQITeca8w7_uYO6o1zPu7gkPvpIFasFaJMGw-eDoZrsJOOU5fCgGOObpghdwFmM-6odDSYYXfFrshrhN3Byd-s"],null,[201,194,176,255]],null,["USK: Ages 12+",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/R-TrFxpinaWjr37_CZ5GQk7NPeZIZyHcPAaW8wUutdyhiLJncPDZubgf7vJtPWaZN0r0_SPIfq_40cFFkg"]],[null,"Increased Incentives to Buy"],[null,"In-Game Purchases (Includes Random Items)"],[null,"\u003ca href\u003d\"https://support.google.com/googleplay?p\u003dappgame_ratings\"\u003eLearn more\u003c/a\u003e"],0,null,[null,2,[272,272],[null,null,"https://play-lh.googleusercontent.com/JyiZb7TsaZcHgss7HOlBnkfmLBh-MLN_11Hdn8483VGxoEBp7aQwNhnho4jTgJ4Yo53Z7VVARewJbQmZZg"]],[null,null,null,null,null,[null,null,"https://support.google.com/googleplay?p\u003dappgame_ratings"]]],[[[[[null,[[0,"EUR",""]],null,[null,"Buy"],null,1,[null,null,null,null,null,[null,null,"https://play.google.com/store/apps/details?id\u003dcom.tiramisu.driftmax2\u0026rdid\u003dcom.tiramisu.driftmax2\u0026feature\u003dmd\u0026offerId"]],null,["CAE\u003d"],null,null,null,null,null,null,null,[]]],["Install"],null,["CgYKBENBRT0\u003d"]]]],[2],null,[1,1,0],["€0.79 - €44.99 if billed through Play",[0]]],[["com.hutchgames. cing scene, where every victory fuels the pursuit of greatness. Connect with friends through the friend list, create private lobbies for personalized races and rally with Asphalt titans, perfect your drifts, and leave your lasting legacy on the racing track with your incredible drift maneuvers! Join or establish racing Clubs, unlocking exclusive rewards as you climb the leaderboards. Experience a new cooperative multiplayer mode where you can be a Security agent chasing down Syndicate members or one of the outlaws evading capture. \u003cbr\u003e\u003cbr\u003eSelect Your Ultimate Racing Car and Dominate \u003cbr\u003e\u003cbr\u003eHarness the power of over 300 cars from elite manufacturers like Ferrari, Porsche, and Lamborghini, each meticulously crafted to push the boundaries of speed and performance. Conquer tracks inspired by iconic global locations, cherished by car racing enthusiasts worldwide, and showcase your drifting prowess on every curve, turning each corner into a perfect drift opportunity. \u003cbr\u003e\u003cbr\u003eExperience the Thrill of Absolute Racing Control\u003cbr\u003e\u003cbr\u003eFeel the adrenaline rush as you and your team dive into electrifying online multiplayer car races, perform gravity-defying drifts and stunts, and power to victory with adrenaline-fueled boosts. Whether with precise manual control or the streamlined TouchDrive™, Asphalt Legends puts you in the driver\u0026#39;s seat, ready to steal the spotlight in online races with your perfect drifts and unparalleled drift control! \u003cbr\u003e\u003cbr\u003eArcade Racing at Its Finest\u003cbr\u003e\u003cbr\u003eDive into the adrenaline-fueled high-speed car racing world, featuring meticulously detailed vehicles, stunning effects, and vibrant dynamic lighting. Become one with the asphalt, perfect your drift techniques, and challenge the world like a true racing champion with your unmatched drifts and extraordinary drifting precision! \u003cbr\u003e\u003cbr\u003eKick-Start Your Racing Legacy\u003cbr\u003e \u003cbr\u003eTake the wheel and embark on your journey to greatness in Career mode. Navigate through endless seasons, conquering diverse challenges at every turn. Feel the rush of pulse-pounding events, complemented by a constant stream of limited-time challenges and activities to keep you on the edge of your seat. This is your chance to carve out a legacy that echoes throughout the world, marked by your signature drifts and legendary drifting achievements! \u003cbr\u003e\u003cbr\u003eCustomize Your Ride, Dominate the Race\u003cbr\u003e\u003cbr\u003ePersonalize your car, then play online to showcase your style to your rivals with unique body paint, rims, wheels, and body kits! Show off your drift mastery, dominate the race with your exceptional drifting skills, and leave your competitors in awe of your flawless drift performance!\u003cbr\u003e\u003cbr\u003eVisit our official site at http://gmlft.co/website_EN\u003cbr\u003eCheck out the new blog at http://gmlft.co/central\u003cbr\u003e\u003cbr\u003eDon\u0026#39;t forget to follow us on social media:\u003cbr\u003eFacebook: https://gmlft.co/ALU_Facebook\u003cbr\u003eTwitter: https://gmlft.co/ALU_X \u003cbr\u003eInstagram: https://gmlft.co/ALU_Instagram\u003cbr\u003eYouTube: https://gmlft.co/ALU_YouTube\u003cbr\u003eForums: https://discord.com/invite/asphaltlegends\u003cbr\u003e\u003cbr\u003eTerms of Use: http://www.gameloft.com/en/conditions-of-use\u003cbr\u003ePrivacy Policy: http://www.gameloft.com/en/privacy-notice\u003cbr\u003eEnd-User License Agreement: http://www.gameloft.com/en/eula\u003cbr\u003eCookies Policy: https://www.gameloft.com/en/legal/showcase-cookie-policy"],"Gameloft SE","100,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/OX4MBiF0vOa6O6aHeT-XIO1YPvDC4K9gKbUvpznY6gx7tfSP16g3BLrE3CfEaf4cK1-fAK50WYvGE9_Msy2B"],null,[54,48,50,255]],null,["USK: Ages 12+",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/ agani, BMW, Audi, Ford, Nissan, Jaguar, Lotus, Chevrolet, Subaru, Mazda, Renault, Peugeot, Volkswagen, AC Cars, Rezvani, RUF, and Naran.\u003cbr\u003e\u003cbr\u003eExperience the sheer power of icons like the Nissan GT-R R34 Skyline, Audi RS6, BMW M3 GTR, Chevrolet Camaro, Ford Mustang, Aston Martin Valhalla, and Pagani Zonda R. Every car is a masterpiece — and it\u0026#39;s waiting for you.\u003cbr\u003e\u003cbr\u003eFans are already dreaming of Lamborghini, Ferrari, Porsche, Mercedes-Benz, and Rolls-Royce joining the lineup — and we hear you. The garage is growing with every update. More legendary machines are joining the race — and the best is yet to come.\u003cbr\u003e\u003cbr\u003e🏁 THREE INCREDIBLE RACING DISCIPLINES. ENDLESS THRILLS.\u003cbr\u003e• Street Racing: Blast through stunning urban circuits, dominate every rival, and taste sweet victory.\u003cbr\u003e• Drift Racing: Master the perfect slide, chain breathtaking drifts, and earn your title as drift king.\u003cbr\u003e• Drag Racing: Experience the explosive launch, the perfect shift, the glorious finish — nothing beats the thrill of pure speed.\u003cbr\u003e• Events \u0026amp; Challenges: Exciting brand showcases, intense time trials, and thrilling seasonal tournaments keep the action fresh every day.\u003cbr\u003e\u003cbr\u003e🔧 YOUR DREAM CAR. YOUR MASTERPIECE.\u003cbr\u003eRace Max Pro isn\u0026#39;t just a car game — it\u0026#39;s your ultimate automotive fantasy. Upgrade engine, turbo, gearbox, nitro, tires, and reduce weight to unleash your car\u0026#39;s true potential.\u003cbr\u003e\u003cbr\u003eFine-tune your perfect setup for breathtaking drift precision or unstoppable drag dominance. Personalize every gorgeous detail — custom paint, stunning rims, bold decals, aerodynamic spoilers, and sleek window tints. Build the car you\u0026#39;ve always dreamed of.\u003cbr\u003e\u003cbr\u003e🌍 BEAUTIFUL TRACKS. EPIC RACING.\u003cbr\u003eRace across spectacular circuits inspired by the stunning Amalfi Coast, breathtaking Nordic roads, vibrant Far East city streets, and iconic U.S. highways. Every location is a visual masterpiece designed for unforgettable racing.\u003cbr\u003e\u003cbr\u003e🏆 COMPETE. CELEBRATE. RISE TO GLORY.\u003cbr\u003eChallenge the world in exhilarating real-time multiplayer racing leagues and ranked seasons. Rise through the leaderboards, earn incredible rewards, and prove you\u0026#39;re the ultimate racing champion.\u003cbr\u003e\u003cbr\u003eLove the freedom of solo play? Race Max Pro offers a complete, deeply satisfying offline career with 215+ thrilling races — no Wi-Fi needed, just pure racing joy.\u003cbr\u003e\u003cbr\u003e⚡ EVERYTHING YOU\u0026#39;VE EVER WANTED IN A RACING GAME\u003cbr\u003e✔ Awe-inspiring licensed supercars \u0026amp; hypercars\u003cbr\u003e✔ Street Racing, Drifting \u0026amp; Drag Racing — three incredible worlds in one\u003cbr\u003e✔ 215+ exhilarating career races across gorgeous global tracks\u003cbr\u003e✔ Deep, rewarding car customization, tuning \u0026amp; building\u003cbr\u003e✔ Heart-pounding multiplayer racing \u0026amp; competitive ranked leagues\u003cbr\u003e✔ Full offline racing — enjoy anytime, anywhere\u003cbr\u003e✔ Exciting updates — spectacular new cars, seasons \u0026amp; events\u003cbr\u003e\u003cbr\u003eDownload Race Max Pro today. The ultimate street racing simulator is here — and it\u0026#39;s absolutely glorious.\u003cbr\u003eFeel the speed. Own every drift. Win every drag race. Your legend starts now."],"Revani","50,000,000+",null,"",null,null,null,null,[null,2,[500,1024],[null,null,"https://play-lh.googleusercontent.com/cikqf3bzGtufrD1cfxEDFCt35BPZLxFdHFL5xCSdUqENeXUgmr-BGlTDZsnYBSpXlHW5b9_1hT47C39M4RXU-g"],null,[124,1,2,255]],null,["USK: Ages 12+",[null,2,[512,512],[null,null,"https://play-lh.googleusercontent.com/R-TrFxpinaWjr37_CZ5GQk7NPeZIZyHcPAaW8wUutdyhiLJncPDZubgf7vJtPWaZN0r0_SPIfq_40cFFkg"]],[null,"Increased Incentives to Buy"],[null,"In-Game Purchases (Includes Random Items)"],[null uitive, customizable controls will fit any racer.\u003cbr\u003eUnique tracks designed specifically for drift.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eLots of cars\u003c/b\u003e - Supercars and exotics? Check. Tuners and street racers? Check. Classic and modern muscle? You bet! The best part? There’s always more coming to the game!\u003cbr\u003eWe know you love drag racing cars — there are more than 150 cars to collect and race.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eFair play\u003c/b\u003e - No “fuel” timers. No waiting for deliveries of cars or upgrades. Every vehicle can be competitive and there are no “premium-only” upgrades. It’s all about driving skill and dedication.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eReal racers \u0026amp; teams\u003c/b\u003e – We’re all about multiplayer racing: there’s always an online rival waiting for you on the street or the track. Race any distance from 1/8 to a full mile, join or create a team, win tournaments with your crew, climb the leaderboards, or test your nerves in wager races.\u003cbr\u003eJump into live multiplayer races in real time with friends and opponents worldwide! Compete in weekly regional tournaments, rise through divisions, and fight your way to the elite ranks.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eEpic upgrades\u003c/b\u003e - Upgrade and improve 33 unique car components with 3 tiers of aftermarket blueprints. Satisfy your need for speed and build a one-of-a-kind drag racing machine. Ever dreamed of smoking an exotic sports car in your 800 HP hatchback? Happens every day.\u003cbr\u003e\u003cbr\u003e\u003cb\u003ePersonal touch\u003c/b\u003e – Customize your drag car with cool decals and place them however you like. Choose your own paint colors and finishes. Add high-performance tires, custom rims, and aftermarket body parts like bumpers, skirts, and spoilers to create a unique look.\u003cbr\u003e\u003cbr\u003e\u003cb\u003eCar geeks welcome\u003c/b\u003e – Powered by an advanced physics engine, the game deliv
