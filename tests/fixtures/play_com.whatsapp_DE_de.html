ww.whatsapp.com/"]],["android@support.whatsapp.com"],null,null,["Meta Platforms, Inc.",["android@support.whatsapp.com"],["1 Meta Way\nMenlo Park, CA 94025-1444\nUnited States"],"+1 650-853-1300"]],null,null,[[null,"WhatsApp von Meta ist eine KOSTENLOSE App für Nachrichten und Videoanrufe. Sie wird derzeit von über zwei Milliarden Menschen in mehr als 180 Ländern genutzt. Sie ist einfach, zuverlässig und privat – so bleibst du ganz leicht mit Freund*innen und Familienmitgliedern in Kontakt. WhatsApp funktioniert auf Mobil- und Desktopgeräten – auch bei langsamen Verbindungen und ohne Abogebühren*.\u003cbr\u003e    \u003cbr\u003e \u003cbr\u003e  Private Nachrichten weltweit\u003cbr\u003e \u003cbr\u003e  Deine persönlichen Nachrichten und Anrufe an Freund*innen und Familienmitglieder sind Ende-zu-Ende-verschlüsselt. Niemand außerhalb deiner Chats kann sie lesen oder anhören, nicht einmal WhatsApp.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e  Sofort, einfach und sicher verbinden \u003cbr\u003e Du brauchst nur deine Telefonnummer, keine Benutzernamen oder Anmeldedaten. Finde deine Kontakte schnell auf WhatsApp und chatte mit ihnen. \u003cbr\u003e \u003cbr\u003e Sprach- und Videoanrufe in hoher Qualität führen \u003cbr\u003e Tätige sichere Video- und Sprachanrufe mit bis zu 32 Personen – kostenlos*. Rufe auf Mobilgeräten über den Internetdienst deines Telefons an, auch bei langsamen Verbindungen. \u003cbr\u003e \u003cbr\u003e In Kontakt bleiben mit Gruppenchats \u003cbr\u003e Bleib mit Freund*innen und Familienmitglieder in Kontakt. In Ende-zu-Ende-verschlüsselten Gruppenchats kannst du Nachrichten, Fotos, Videos und Dokumente teilen – und das auf Mobil- und -Desktopgeräten. \u003cbr\u003e \u003cbr\u003e In Echtzeit in Verbindung bleiben \u003cbr\u003e Teile deinen Standort nur mit Personen in deinen Einzel- oder Gruppenchats. Du kannst das Teilen jederzeit beenden. Nimm eine Sprachnachricht auf, um dich schnell zu verbinden.\u003cbr\u003e \u003cbr\u003e \u003cbr\u003e Mit der Status-Funktion tägliche Momente teilen \u003cbr\u003e Im Status kannst du Texte, Fotos, Videos und GIFs teilen, die nach 24 Stunden wieder verschwinden. Du kannst entscheiden, ob du deine Statusmeldungen mit allen oder nur mit bestimmten Kontakten teilen möchtest. \u003cbr\u003e \u003cbr\u003e Verwende WhatsApp auf deiner Watch mit Wear OS, um Unterhaltungen fortzusetzen, auf Nachrichten zu antworten und Anrufe anzunehmen – alles direkt von deinem Handgelenk aus. Mit Kacheln und Komplikationen kannst du schnell auf deine Chats zugreifen und Sprachnachrichten senden.   \u003cbr\u003e \u003cbr\u003e*In einigen Regionen verwendet WhatsApp SMS-Verifizierung, um deine Telefonnummer zu authentifizieren und Transaktionen abzusichern.\u003cbr\u003e*Es können die normalen Datennutzungsgebühren anfallen. Kontaktiere deinen Provider für mehr Informationen.     \u003cbr\u003e______________________________________________________________  \u003cbr\u003e Für Feedback oder Fragen öffne „WhatsApp“ \u0026gt; „Einstellungen“ \u0026gt; „Hilfe“ \u0026gt; „Kontaktiere uns“.\u003cbr\u003e  \u003cbr\u003e Nutzungsbedingungen: https://www.whatsapp.com/legal/terms-of-service  \u003cbr\u003e Weitere Informationen zum privaten Nachrichtenaustausch: https://www.whatsapp.com/privacy  \u003cbr\u003e Weitere Informationen zur Sicherheit auf WhatsApp: https://www.whatsapp.com/security"]],[[null,"Einfach. Persönlich. Sicher."]],[null,null,[[["Geräte- und App-Verlauf",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/BAH0TYCVcT4bH2ErsHtCEbO-1Tr5O5Hjwst6AFghZQt5pI8NkfonAsmYfnvj939aqSVtbuM81B38AB0GYQ"]],[[null,"Aktive Apps abrufen"]],["history"]],["Identität",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/AUs-Fih7eEfuhp-4lYGGK65UvYQ2K6qaKi0dRUipSmiac-QL94IbT-XylwOgMoaYBDLuGOz1l5Yn_K6z1NM"]],[[null,"Konten auf dem Gerät finden"],[null,"Konten hinzufügen oder entfernen"],[null,"Kontaktkarten lesen"]],["perm_identity"]],["Kontakte",[null,2,null,[null,null,"https://play  Gaming-Highlights und Modetipps bis hin zu Musik und angesagten Sounds – dein „Für dich“-Feed passt sich dem an, was dich inspiriert.\u003cbr\u003e\u003cbr\u003eErstellen ist ganz einfach. Nimm Videos auf und mach alltägliche Momente mit einfachen Bearbeitungstools, Effekten, Sounds und Musik zu etwas Besonderem. Nutze kostenlos eine große Bibliothek mit Sounds und Musik für Videos sowie Filter und kreative Tools, mit denen sich deine Inhalte abheben. Auf TikTok können alle Inhalte erstellen und inspirierende Ideen erhalten eine neue Dynamik.\u003cbr\u003e\u003cbr\u003eMit TikTok wird das Entdecken zum Alltag. Finde Creator*innen zum Folgen, neue Ideen zum Ausprobieren und Produkte von kleinen Unternehmen und Marken aus aller Welt. TikTok bietet mehr als 50 voreingestellte Sicherheits- und Datenschutzfunktionen, von privaten Konten und Inhaltsfiltern bis hin zu Bildschirmzeit-Tools und dem begleiteten Modus, damit du die am besten zu dir passende Erfahrung wählen kannst. TikTok bietet zusätzliche Unterstützung für Teenager*innen und Familien, damit du Zeit- und Inhaltspräferenzen für deine Familie festlegen kannst.\u003cbr\u003e\u003cbr\u003e■ Personalisierte Entdeckungen\u003cbr\u003eEin „Für dich“-Feed, der lernt, was dir gefällt. Entdecke Videos, Creator*innen, Livestreams, Shoppingmöglichkeiten und Communitys basierend auf dem, was du ansiehst, likest und teilst.\u003cbr\u003e\u003cbr\u003e■ Unterhaltung, Bildung und alles dazwischen\u003cbr\u003eComedy, Gaming, DIY, Beauty, Sport, Musik, Lifestyle, Bildung und mehr. Finde Inhalte, die dich zum Lachen und Nachdenken bringen und dich etwas Neues ausprobieren lassen.\u003cbr\u003e\u003cbr\u003e■ Einfache, leistungsstarke Erstellungstools\u003cbr\u003eDu kannst Clips aufnehmen, pausieren und die Aufnahme fortsetzen, zuschneiden und zusammenfügen, Text und Sticker hinzufügen und dein Video optimieren – alles in der App.\u003cbr\u003e\u003cbr\u003e■ Sounds, Musik und Effekte\u003cbr\u003eNutze unsere kostenlose Bibliothek mit Sounds und Musik für deine Videos sowie Filter, Effekte und kreative Tools, mit denen du dich ausdrücken und deine Videos hervorstechen lassen kannst.\u003cbr\u003e\u003cbr\u003e■ Eine globale Community von Creator*innen\u003cbr\u003eFolge deinen Lieblings-Creator*innen und entdecke jeden Tag neue Talente. Teile deine eigene Story oder unterstütze inspirierende Menschen.\u003cbr\u003e\u003cbr\u003e■ Mit TikTok Shop entdecken und shoppen\u003cbr\u003eEntdecke angesagte Produkte, exklusive Angebote und nahtlose Shoppingerlebnisse, inspiriert von Creator*innen und Marken, die du liebst. Shoppe direkt aus Videos, LIVEs und über den Tab „Shop“, verfolge Bestellungen und genieße ein sicheres Shopping- und Transaktionserlebnis.\u003cbr\u003e\u003cbr\u003e■ LIVE gehen und sich in Echtzeit mit anderen verbinden\u003cbr\u003eStarte ein LIVE, um mit deiner Community zu chatten, besondere Momente zu teilen und spezielle Funktionen und Vorteile freizuschalten, sofern verfügbar.\u003cbr\u003e\u003cbr\u003e■ Tools zur Gestaltung deiner Erfahrung\u003cbr\u003eNutze mehr als 50 Sicherheits- und Datenschutzfunktionen – von privaten Konten und Inhaltsfiltern bis hin zu Bildschirmzeit-Tools, dem begleiteten Modus und anderen Einstellungen. So bestimmst du, wie TikTok für dich und deine Familie funktioniert.\u003cbr\u003e\u003cbr\u003eBist du bereit, herauszufinden, was es als Nächstes zu entdecken gibt? Lade TikTok herunter, um deine Welt auf eine neue Weise zu sehen, zu gestalten und zu entdecken.\u003cbr\u003eErfahre mehr über unsere Sicherheitstools, -ressourcen und -richtlinien im TikTok Sicherheitszentrum:\u003cbr\u003ehttps://www.tiktok.com/safety/en\u003cbr\u003eNutzungsbedingungen:\u003cbr\u003ehttps://www.tiktok.com/legal/terms-of-service\u003cbr\u003eDatenschutzerklärung:\u003cbr\u003ehttps://www.tiktok.com/legal/privacy-policy\u003cbr\u003eFeedback?\u003cbr\u003eKontaktiere uns unter https://www.tiktok.com/legal/report/feedback."],"TikTok Pte. Ltd.","1.000.000.000 pchat öffnet direkt die Kamera – tippe, um ein Foto zu machen, oder halte gedrückt, um ein Video aufzunehmen. \u003cbr\u003e• Mit Linsen, Filtern, Bitmoji und weiteren tollen Features kannst du deiner Kreativität Ausdruck verleihen! \u003cbr\u003e• Probiere täglich neue Linsen aus, die von der Snapchat Community erstellt werden!\u003cbr\u003e\u003cbr\u003eCHATTEN\u003cbr\u003e• Bleib über den Chat in Kontakt mit deinen Freunden oder zeig in Gruppen-Storys, wie dein Tag so läuft. \u003cbr\u003e• Du kannst mit bis zu 16 Freunden gleichzeitig videochatten – dabei kannst du sogar Filter und Linsen verwenden! \u003cbr\u003e• Zeig deine Individualität mit Friendmoji – das sind exklusive Bitmoji, die extra für dich und einen Freund erstellt werden.\u003cbr\u003e\u003cbr\u003eSTORYS\u003cbr\u003e• Schau dir die Storys deiner Freunde an, um zu sehen, was bei ihnen los ist. \u003cbr\u003e• Sieh dir Storys aus der Snapchat Community an, die auf deinen Interessen basieren. \u003cbr\u003e• Entdecke aktuelle Nachrichten und exklusive Original-Shows.\u003cbr\u003e\u003cbr\u003eSPOTLIGHT\u003cbr\u003e• Bei Spotlight findest du die besten Snaps! \u003cbr\u003e• Poste eigene Snaps oder lehne dich einfach zurück und schau zu. \u003cbr\u003e• Wähle deine Favoriten aus und teile sie mit deinen Freunden.\u003cbr\u003e\u003cbr\u003eSNAP MAP \u003cbr\u003e• Teile deinen Standort mit deinen besten Freunden oder tauche unter mit dem Geistmodus. \u003cbr\u003e• Auf deiner persönlichen Karte kannst du sehen, was deine Freunde gerade machen, wenn sie ihren Standort mit dir teilen. \u003cbr\u003e• Entdecke Live-Storys aus der Community in deiner Nähe oder aus der ganzen Welt!\u003cbr\u003e\u003cbr\u003eMEMORYS\u003cbr\u003e• Speichere eine unbegrenzte Anzahl von Fotos und Videos all deiner schönsten Momente. \u003cbr\u003e• Bearbeite vergangene Momente und schicke sie an Freunde oder speichere sie in deinen Aufnahmen. \u003cbr\u003e• Erstelle Storys aus deinen schönsten Erinnerungen, um sie mit
