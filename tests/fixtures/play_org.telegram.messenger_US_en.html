org"],["3501, 3502, 3601, 3602, Al Habtoor Business Tower, Marsa\nإمارة دبيّ\nUnited Arab Emirates"],"+971 54 202 2222"]],null,null,[[null,"Pure instant messaging — simple, fast, secure, and synced across all your devices. One of the top 5 most downloaded apps in the world with over 1 billion active users.\u003cbr\u003e\u003cbr\u003eFAST: Telegram is the fastest messaging app on the market, connecting people via a unique, distributed network of data centers around the globe.\u003cbr\u003e\u003cbr\u003eSYNCED: You can access your messages from all your phones, tablets and computers at once. Telegram apps are standalone, so you don’t need to keep your phone connected. Start typing on one device and finish the message from another. Never lose your data again.\u003cbr\u003e\u003cbr\u003eUNLIMITED: You can send media and files, without any limits on their type and size. Your entire chat history will require no disk space on your device, and will be securely stored in the Telegram cloud for as long as you need it. \u003cbr\u003e\u003cbr\u003eSECURE: We made it our mission to provide the best security combined with ease of use. Everything on Telegram, including chats, groups, media, etc. is encrypted using a combination of 256-bit symmetric AES encryption, 2048-bit RSA encryption, and Diffie–Hellman secure key exchange. \u003cbr\u003e\u003cbr\u003e100% FREE \u0026amp; OPEN: Telegram has a fully documented and free API for developers, open source apps and verifiable builds to prove the app you download is built from the exact same source code that is published. \u003cbr\u003e\u003cbr\u003ePOWERFUL: You can create group chats with up to 200,000 members, share large videos, documents of any type (.DOCX, .MP3, .ZIP, etc.) up to 2 GB each, and even set up bots for specific tasks. Telegram is the perfect tool for hosting online communities and coordinating teamwork.\u003cbr\u003e\u003cbr\u003eRELIABLE: Built to deliver your messages using as little data as possible, Telegram is the most reliable messaging system ever made. It works even on the weakest mobile connections. \u003cbr\u003e\u003cbr\u003eFUN: Telegram has powerful photo and video editing tools, animated stickers and emoji, fully customizable themes to change the appearance of your app, and an open sticker/GIF platform to cater to all your expressive needs.\u003cbr\u003e\u003cbr\u003eSIMPLE: While providing an unprecedented array of features, we take great care to keep the interface clean. Telegram is so simple you already know how to use it.\u003cbr\u003e\u003cbr\u003ePRIVATE: We take your privacy seriously and will never give any third parties access to your data. You can delete any message you ever sent or received for both sides, at any time and without a trace. Telegram will never use your data to show you ads.\u003cbr\u003e\u003cbr\u003eFor those interested in maximum privacy, Telegram offers Secret Chats. Secret Chat messages can be programmed to self-destruct automatically from both participating devices. This way you can send all types of disappearing content — messages, photos, videos, and even files. Secret Chats use End-to-End Encryption to ensure that a message can only be read by its intended recipient.\u003cbr\u003e\u003cbr\u003eWe keep expanding the boundaries of what you can do with a messaging app. Don’t wait years for older messengers to catch up with Telegram — join the revolution today."]],[[null,"Telegram is a messaging app with a focus on speed and security."]],[null,null,[[["Identity",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/AUs-Fih7eEfuhp-4lYGGK65UvYQ2K6qaKi0dRUipSmiac-QL94IbT-XylwOgMoaYBDLuGOz1l5Yn_K6z1NM"]],[[null,"find accounts on the device"],[null,"add or remove accounts"],[null,"read your own contact card"]],["perm_identity"]],["Contacts",[null,2,null,[null,null,"https://play-lh.googleusercontent.com/c5fJsmDZCeHY1tZmeGXL12sHi8herULd72A_egjaAHylmgM-4gLiw4CuDJSzNnK5q8yxAAy4RyxtkdYzcg"]],[[null,"find accounts on the device"],[null
